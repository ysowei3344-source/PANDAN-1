server {
    listen 80;
    listen [::]:80;
    server_name p.rvppp.cn;

    root /var/www/p.rvppp.cn;
    index index.html;

    # nginx defaults to 1m, which silently 413s any real photo (phone
    # camera photos routinely run 2-8m) picked for 商品主图/配置布局 uploads.
    client_max_body_size 20m;

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin console is edited and redeployed frequently during active
    # development; never let browsers cache a stale copy of it.
    location /console/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /console/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
