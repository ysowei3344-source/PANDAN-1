name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ECS instance cannot reach github.com directly (network restriction
      # observed from mainland China), so the runner pushes files to it over
      # rsync/ssh instead of having the server git-pull from GitHub.
      - name: Rsync backend to ECS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: backend/
          remote_path: ${{ secrets.ECS_TARGET_DIR }}/backend/
          remote_host: ${{ secrets.ECS_HOST }}
          remote_port: ${{ secrets.ECS_PORT }}
          remote_user: ${{ secrets.ECS_USER }}
          remote_key: ${{ secrets.ECS_SSH_KEY }}

      - name: Install deps and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script: |
            set -e
            cd ${{ secrets.ECS_TARGET_DIR }}/backend
            python3 -m venv .venv || true
            .venv/bin/pip install -q -r requirements.txt
            systemctl restart pandan1-backend
