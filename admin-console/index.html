<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号矩阵中枢 · 管理台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css">
<style>
  :root {
    --bg: #0f1218;
    --sidebar: #12151f;
    --card: #1a1e2b;
    --card-2: #232838;
    --line: #2a3040;
    --ink: #e8eaf0;
    --ink-soft: #8890a3;
    --ink-faint: #5b6377;
    --accent: #4f7dfa;
    --accent-soft: rgba(79, 125, 250, 0.16);
    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.14);
    --danger: #f472b6;
    --danger-soft: rgba(244, 114, 182, 0.14);
    --warning: #eab308;
    --warning-soft: rgba(234, 179, 8, 0.12);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  [hidden] { display: none !important; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.link-confirm-btn { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); }
  button.link-confirm-btn.locked-btn { background: var(--accent); color: #fff; border: none; }
  input[type="text"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; }
  .field-preview-img { margin-top: 10px; max-width: 240px; max-height: 120px; border-radius: 8px; display: block; }
  label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--success); }
  input[type="text"]:disabled { background: rgba(255, 255, 255, 0.03); color: var(--ink-faint); cursor: not-allowed; }

  .p-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex-shrink: 0;
  }
  .link-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -2px; }
  .link-locked-text { font-size: 14px; line-height: 1.5; word-break: break-all; padding: 2px 0; color: #fff; }
  .link-tutorial { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: none; }
  .link-tutorial:hover { text-decoration: underline; }
  .modal-card.wide { max-width: 640px; max-height: 82vh; overflow-y: auto; }
  .tutorial-title { font-size: 16px; font-weight: 700; margin: 4px 0 12px; }
  .tutorial-content { font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
  .tutorial-content img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
  .tutorial-content p { margin: 0 0 10px; }
  .tutorial-content h2, .tutorial-content h3 { color: var(--ink); margin: 14px 0 8px; }
  .tutorial-content ul, .tutorial-content ol { margin: 0 0 10px; padding-left: 22px; }
  .tutorial-content a { color: var(--accent); }
  .tutorial-list-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .tutorial-list-item:last-child { border-bottom: none; }
  .tutorial-list-item .row-body { flex: 1; min-width: 0; }
  .tutorial-list-item .tag {
    font-size: 10px; color: var(--ink-faint); background: rgba(255, 255, 255, 0.06);
    padding: 1px 6px; border-radius: 999px;
  }

  /* ---------- Quill editor (dark theme override) ---------- */
  .ql-toolbar.ql-snow { border-color: var(--line); background: var(--card-2); border-radius: 8px 8px 0 0; }
  .ql-container.ql-snow { border-color: var(--line); border-radius: 0 0 8px 8px; font-size: 14px; }
  .ql-editor { min-height: 220px; color: var(--ink); }
  .ql-editor.ql-blank::before { color: var(--ink-faint); font-style: normal; }
  .ql-snow .ql-stroke { stroke: var(--ink-soft); }
  .ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill { fill: var(--ink-soft); }
  .ql-snow .ql-picker { color: var(--ink-soft); }
  .ql-snow .ql-picker-options { background: var(--card); border-color: var(--line) !important; }
  .ql-snow .ql-tooltip { background: var(--card); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
  .ql-snow .ql-tooltip input[type="text"] { background: var(--card-2); color: var(--ink); border-color: var(--line); }
  .ql-snow .ql-toolbar button:hover .ql-stroke, .ql-snow .ql-toolbar button.ql-active .ql-stroke { stroke: var(--accent); }
  .ql-snow .ql-toolbar button:hover .ql-fill, .ql-snow .ql-toolbar button.ql-active .ql-fill { fill: var(--accent); }
  .ql-editor img { max-width: 100%; border-radius: 8px; }

  /* ---------- Login ---------- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 32px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p.hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }

  /* ---------- Shell ---------- */
  /* Sidebar is a fixed overlay (out of document flow) so the page uses
     normal browser scrolling — only .main-area's left margin moves to make
     room for it, nothing gets its own inner scroll container. */
  .shell { min-height: 100vh; }
  .sidebar {
    width: 220px;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    z-index: 50;
  }
  .brand-block { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.3; }
  .brand-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .brand-sub { font-size: 12px; font-weight: 500; color: var(--ink-faint); }
  .brand-box {
    border: 1px dashed transparent;
    border-radius: 5px;
    padding: 0 4px;
    cursor: pointer;
  }
  .brand-box.editable { border-color: var(--line); }
  .brand-box.editable:hover { border-color: var(--accent); background: var(--accent-soft); }
  #brandInput { width: 96px; padding: 1px 6px; font-size: 15px; font-weight: 700; border-radius: 5px; }

  .nav-group-label { font-size: 11px; color: var(--ink-faint); padding: 14px 12px 6px; letter-spacing: 0.04em; }
  .nav-item {
    padding: 10px 12px; border-radius: 10px; font-size: 14px;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.04); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .tag {
    font-size: 10px; color: var(--ink-faint); background: rgba(255, 255, 255, 0.06);
    padding: 1px 6px; border-radius: 999px; margin-left: auto;
  }
  .nav-item .nav-caret { margin-left: auto; font-size: 18px; line-height: 1; color: var(--ink-soft); font-weight: 700; }
  .nav-item.nav-child { padding-left: 28px; font-size: 13px; }

  .main-area { min-width: 0; margin-left: 220px; display: flex; flex-direction: column; }
  .content-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-soft); }
  .role-badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; }
  .content-body { padding: 24px 28px 80px; max-width: 1200px; }

  /* ---------- Account switcher ---------- */
  .acc-switcher { position: relative; }
  .acc-switcher-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
    font-weight: 600; font-size: 14px;
  }
  .acc-avatar {
    width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  .chevron { color: var(--ink-faint); font-size: 11px; }
  .acc-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 220px; max-height: 320px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 20;
  }
  .acc-dropdown-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; cursor: pointer;
  }
  .acc-dropdown-item:hover { background: rgba(255, 255, 255, 0.05); }
  .acc-dropdown-item .acc-sub { font-size: 11px; color: var(--ink-faint); margin-left: auto; }

  /* ---------- Overview page ---------- */
  .page-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .page-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }

  .alert-banner {
    display: flex; align-items: center; gap: 10px; background: var(--warning-soft); border: 1px solid rgba(234,179,8,0.3);
    color: var(--warning); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px;
  }
  .alert-banner .close-btn { margin-left: auto; background: transparent; color: var(--warning); padding: 0 4px; font-size: 15px; }

  /* kpi-grid and overview-grid share a 7-column template (matching the
     current 7 KPI cards) so the panels below line up with specific cards:
     video/trend under cards 1-5, diagnosis under cards 6-7. If the KPI
     card count changes, update both the column count and the spans below. */
  .kpi-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .kpi-label { font-size: 12px; color: var(--ink-soft); }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .kpi-delta { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; width: fit-content; }
  .kpi-delta.up { background: var(--success-soft); color: var(--success); }
  .kpi-delta.down { background: var(--danger-soft); color: var(--danger); }
  .kpi-spark { width: 100%; height: 36px; }
  .kpi-combined { display: flex; flex-direction: column; gap: 8px; }
  .kpi-combined-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .kpi-combined-label { font-size: 12px; color: var(--ink-soft); width: 30px; flex-shrink: 0; }
  .kpi-combined-val { font-size: 17px; font-weight: 700; flex: 1; }
  .kpi-combined .kpi-delta { font-size: 10px; padding: 1px 6px; flex-shrink: 0; }

  .overview-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto auto;
    gap: 16px; align-items: stretch; margin-top: 20px;
  }
  .overview-grid .video-panel { grid-column: 1 / span 5; grid-row: 1; }
  .overview-grid .trend-panel { grid-column: 1 / span 5; grid-row: 2; }
  .overview-grid .diagnosis-panel { grid-column: 6 / span 2; grid-row: 1 / span 2; display: flex; flex-direction: column; }
  @media (max-width: 1024px) {
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .overview-grid { grid-template-columns: 1fr; }
    .overview-grid .video-panel, .overview-grid .trend-panel, .overview-grid .diagnosis-panel { grid-column: 1; }
    .overview-grid .diagnosis-panel { grid-row: auto; }
  }

  .video-preview-916 {
    position: relative; width: 100%; max-width: 220px; aspect-ratio: 9 / 16;
    border-radius: 12px; overflow: hidden; margin: 0 auto 8px; cursor: pointer; background: var(--card-2);
  }
  .video-preview-916 img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .play-badge {
    width: 52px; height: 52px; border-radius: 50%; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
  }
  .preview-play-msg { text-align: center; margin: 0 0 16px; min-height: 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  .panel-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .period-toggle { display: flex; gap: 4px; background: var(--card-2); border-radius: 8px; padding: 3px; }
  .period-toggle button {
    background: transparent; color: var(--ink-soft); padding: 5px 14px; font-size: 12px; border-radius: 6px;
  }
  .period-toggle button.active { background: var(--accent); color: #fff; }
  .trend-chart { width: 100%; height: 220px; }

  .platform-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  #platformStatRow { margin-bottom: 16px; }
  .tab-chip {
    padding: 7px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); background: var(--card-2); cursor: pointer;
  }
  .tab-chip.active { color: #fff; background: var(--accent); }

  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .grid-thumb {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 3 / 4; background: var(--card-2);
  }
  .grid-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid-thumb .grid-overlay {
    position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }

  .diagnosis-meta { font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; }
  .diagnosis-block { display: flex; gap: 10px; margin-bottom: 16px; }
  .diagnosis-tag {
    flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px; height: fit-content;
  }
  .diagnosis-tag.risk { background: var(--danger-soft); color: var(--danger); }
  .diagnosis-tag.opportunity { background: var(--success-soft); color: var(--success); }
  .diagnosis-text { font-size: 13px; line-height: 1.7; color: var(--ink); }
  .diagnosis-back {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent);
    cursor: pointer; margin-bottom: 14px; background: none; padding: 0; font-weight: 600;
  }
  .video-stats-row { display: flex; gap: 16px; margin: 10px 0 16px; }
  .video-stats-row span { font-size: 12px; color: var(--ink-soft); }

  .video-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .video-thumb-item { flex-shrink: 0; width: 140px; cursor: pointer; }
  .video-thumb-item img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 10px;
    border: 2px solid transparent; display: block;
  }
  .video-thumb-item.active img { border-color: var(--accent); }
  .video-thumb-item .thumb-title {
    display: block; font-size: 11px; color: var(--ink-soft); margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .video-thumb-item.active .thumb-title { color: var(--accent); }

  /* ---------- Generic list / form panels (banners, users, accounts) ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .users-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) {
    .users-columns { grid-template-columns: 1fr; }
  }
  .add-account-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 1100px) {
    .add-account-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .add-account-grid { grid-template-columns: 1fr; }
  }
  .activity-row { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .activity-row:last-child { border-bottom: none; }
  .activity-time { color: var(--ink-faint); font-size: 12px; white-space: nowrap; flex-shrink: 0; width: 70px; }
  .activity-user { font-weight: 600; flex-shrink: 0; }
  .activity-action { color: var(--ink-soft); flex-shrink: 0; }
  .activity-detail { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { margin-top: 16px; display: flex; gap: 10px; }
  .row-item { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row-item:last-child { border-bottom: none; }
  .row-item img { width: 120px; height: 48px; object-fit: cover; border-radius: 8px; background: var(--card-2); flex-shrink: 0; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns button { padding: 6px 12px; font-size: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .badge-dark { background: #05070c; color: #fff; }
  .badge-green { background: var(--success-soft); color: var(--success); }
  .badge-pink { background: var(--danger-soft); color: var(--danger); }
  .badge-blue { background: var(--accent-soft); color: var(--accent); }

  .mini-tag {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px; font-size: 10px; font-weight: 700; margin-right: 3px;
  }

  .identity-bind-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .mini-tag-remove {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); padding: 3px 6px 3px 10px; border-radius: 999px;
  }
  .mini-tag-remove span { cursor: pointer; color: var(--ink-faint); font-size: 11px; }
  .mini-tag-remove span:hover { color: var(--danger); }
  .bind-select {
    font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px dashed var(--line);
    background: transparent; color: var(--ink-soft); width: auto;
  }

  .identity-card {
    display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .identity-card:last-child { border-bottom: none; }
  .identity-card:hover { background: rgba(255, 255, 255, 0.03); }
  .identity-avatar {
    width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0;
  }
  .identity-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .identity-name { font-size: 15px; font-weight: 600; }
  .identity-sub { font-size: 12px; color: var(--ink-soft); }
  .identity-platforms { display: flex; gap: 4px; }
  .identity-stats { text-align: right; display: flex; flex-direction: column; gap: 2px; }
  .identity-stats .num { font-size: 15px; font-weight: 700; }
  .identity-stats .label { font-size: 11px; color: var(--ink-soft); }
  .identity-chevron { color: var(--ink-faint); font-size: 16px; }
  .identity-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line);
    color: var(--ink-soft); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  .platform-detail-row {
    display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .platform-detail-row:last-child { border-bottom: none; }

  .empty-hint { color: var(--ink-soft); font-size: 13px; text-align: center; padding: 40px 0; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(6, 8, 12, 0.65);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px; width: 100%; max-width: 340px;
  }
  .modal-card h2 { margin: 0 0 8px; }

  .crop-viewport {
    position: relative; width: 270px; height: 480px; margin: 0 auto 14px;
    overflow: hidden; background: #000; border-radius: 8px; border: 1px solid var(--line);
    touch-action: none; cursor: grab;
  }
  .crop-viewport:active { cursor: grabbing; }
  .crop-viewport img { position: absolute; user-select: none; -webkit-user-drag: none; touch-action: none; }
  .crop-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .crop-controls input[type="range"] { flex: 1; }

  .img-preview-wrap { position: relative; display: inline-block; margin-top: 10px; }
  .img-preview-wrap .field-preview-img { margin-top: 0; }
  .img-edit-btn {
    position: absolute; right: 6px; bottom: 6px; z-index: 2;
    background: rgba(6, 8, 12, 0.6); color: #fff; border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 6px; font-size: 12px; padding: 4px 10px; cursor: pointer; line-height: 1.4;
  }
  .img-edit-btn:hover { background: rgba(6, 8, 12, 0.85); }
  .img-progress {
    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; background: rgba(6, 8, 12, 0.7); border-radius: 8px;
  }
  .img-progress-track { width: 80%; height: 6px; background: rgba(255, 255, 255, 0.25); border-radius: 4px; overflow: hidden; }
  .img-progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s linear; }
  .img-progress-text { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }

  .identity-kpi-grid { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 900px) {
    .identity-kpi-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  }
  @media (max-width: 1024px) {
    .sidebar { width: 190px; }
    .main-area { margin-left: 190px; }
  }
  @media (max-width: 768px) {
    .sidebar { width: 160px; padding: 16px 10px; }
    .main-area { margin-left: 160px; }
    .brand-sub { display: none; }
    .content-header { padding: 14px 16px; }
    .content-body { padding: 18px 16px 60px; }
  }
  @media (max-width: 560px) {
    .sidebar { width: 132px; }
    .main-area { margin-left: 132px; }
    .nav-item { padding: 9px 8px; font-size: 13px; }
    .nav-item.nav-child { padding-left: 18px; font-size: 12px; }
    .brand-mark { width: 30px; height: 30px; font-size: 13px; }
    .brand-title { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="login-card">
    <h1><span class="brand-part-login">房车</span>账号矩阵中枢</h1>
    <p class="hint">管理台登录</p>
    <div>
      <label>用户名</label>
      <input type="text" id="loginUsername">
    </div>
    <div>
      <label>密码</label>
      <input type="password" id="loginPassword">
    </div>
    <button onclick="login()">登录</button>
    <p class="msg" id="loginMsg"></p>
  </div>
</div>

<div id="appShell" hidden>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">中</div>
        <div class="brand-text">
          <span class="brand-title">
            <span id="brandPart" class="brand-box editable" ondblclick="startEditBrand()" title="双击编辑">房车</span><input
              type="text" id="brandInput" hidden
              onblur="saveBrand()"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}else if(event.key==='Escape'){cancelEditBrand();}">
          </span>
          <span class="brand-sub">账号矩阵中枢</span>
        </div>
      </div>

      <div id="navGroupAnalytics"></div>
      <div class="nav-group-label">工作台</div>
      <div id="navGroupWork"></div>
      <div class="nav-group-label">系统管理</div>
      <div id="navGroupSystem"></div>
    </nav>

    <main class="main-area">
      <header class="content-header">
        <div class="header-left" id="headerLeft"></div>
        <div class="header-right">
          <span class="role-badge" id="roleBadge"></span>
          <span id="usernameLabel"></span>
          <button class="ghost" onclick="logout()">退出登录</button>
        </div>
      </header>
      <div class="content-body">
        <section id="section-overview"></section>
        <section id="section-accounts" hidden></section>
        <section id="section-banners" hidden></section>
        <section id="section-users" hidden></section>
        <section id="section-tutorials" hidden></section>
        <section id="section-orders" hidden></section>
        <section id="section-stub" hidden></section>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="passcodeModal" hidden onclick="closePasscodeModal()"></div>
<div class="modal-overlay" id="tutorialModal" hidden onclick="closeTutorialModal()"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script>
const API_BASE = '/admin/api/admin';
const PUBLIC_API_BASE = '/admin/api';
let currentUser = null;
let allIdentities = [];
let currentAccountId = 'all';
let overviewCache = {};
let activeSection = 'overview';
let trendPeriod = 7;

const NAV_ANALYTICS = [
  { key: 'overview', label: '经营分析总览' },
];
const NAV_WORK = [
  {
    key: 'accounts', label: '矩阵账号管理',
    children: [
      { key: 'accounts-list', label: '账号列表' },
      { key: 'accounts-add', label: '添加账号', roles: ['super_admin'] },
    ],
  },
  { key: 'create', label: '内容创作台', stub: true },
  { key: 'benchmark', label: '爆款视频库', stub: true },
  { key: 'service', label: 'AI 客服', stub: true },
  {
    key: 'orders', label: '订单跟踪',
    children: [
      { key: 'orders-products', label: '商品信息' },
      { key: 'orders-customers', label: '客户信息' },
      { key: 'orders-orders', label: '订单信息' },
      { key: 'orders-aftersales', label: '售后运维' },
    ],
  },
];
const NAV_SYSTEM = [
  { key: 'banners', label: '首页轮播广告' },
  {
    key: 'users', label: '账号权限管理', roles: ['super_admin'],
    children: [
      { key: 'users-internal', label: '内部账号管理' },
      { key: 'users-external', label: '外部账号管理' },
    ],
  },
  {
    key: 'tutorials', label: '使用教程管理',
    children: [
      { key: 'tutorials-add', label: '教程添加' },
    ],
  },
];
let expandedNavGroups = new Set();

function token() { return localStorage.getItem('rv_admin_token') || ''; }
function setToken(t) { t ? localStorage.setItem('rv_admin_token', t) : localStorage.removeItem('rv_admin_token'); }

async function api(path, options = {}, base = API_BASE) {
  const res = await fetch(`${base}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${token()}` },
  });
  if (res.status === 401) {
    setToken(null);
    showLogin('登录已过期，请重新登录');
    throw new Error('unauthorized');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : null;
}

function publicApi(path, options = {}) {
  return api(path, options, PUBLIC_API_BASE);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtNum(n) {
  if (n === undefined || n === null) return '0';
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + '万';
  return Math.round(n).toLocaleString('zh-CN');
}
function platformInitial(p) { return { douyin: '抖', video_channel: '视', xiaohongshu: '红' }[p] || '·'; }
function platformBadge(p) { return { douyin: 'badge-dark', video_channel: 'badge-green', xiaohongshu: 'badge-pink' }[p] || 'badge-blue'; }
function platformLabel(p) { return { douyin: '抖音', video_channel: '视频号', xiaohongshu: '小红书' }[p] || p; }

function showLogin(msg) {
  document.getElementById('loginView').hidden = false;
  document.getElementById('appShell').hidden = true;
  if (msg) {
    document.getElementById('loginMsg').textContent = msg;
    document.getElementById('loginMsg').className = 'msg error';
  }
}

async function login() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; msg.className = 'msg error'; return; }
  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || '登录失败'); }
    const data = await res.json();
    setToken(data.token);
    currentUser = data.user;
    await enterApp();
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

function logout() {
  api('/auth/logout', { method: 'POST' }).catch(() => {});
  setToken(null);
  currentUser = null;
  location.reload();
}

async function enterApp() {
  document.getElementById('loginView').hidden = true;
  document.getElementById('appShell').hidden = false;
  document.getElementById('roleBadge').textContent = currentUser.role === 'super_admin' ? '超级管理员' : '运营';
  document.getElementById('usernameLabel').textContent = currentUser.username;
  renderNav();
  try { allIdentities = await fetch(`${PUBLIC_API_BASE}/identities`).then((r) => r.json()); } catch (e) { allIdentities = []; }
  await showSection('overview');
}

function toggleNavGroup(key) {
  if (expandedNavGroups.has(key)) {
    expandedNavGroups.delete(key);
  } else {
    expandedNavGroups.add(key);
  }
  renderNav();
}

function renderNav() {
  const analytics = document.getElementById('navGroupAnalytics');
  const work = document.getElementById('navGroupWork');
  const sys = document.getElementById('navGroupSystem');
  const render = (items) => items
    .filter((item) => !item.roles || item.roles.includes(currentUser.role))
    .map((item) => {
      if (item.children) {
        const expanded = expandedNavGroups.has(item.key);
        return `
          <div class="nav-item" onclick="toggleNavGroup('${item.key}')">
            ${item.label}
            <span class="nav-caret">${expanded ? '▾' : '▸'}</span>
          </div>
          ${expanded ? item.children
            .filter((c) => !c.roles || c.roles.includes(currentUser.role))
            .map((c) => `
              <div class="nav-item nav-child ${c.key === activeSection ? 'active' : ''}" onclick="showSection('${c.key}')">${c.label}</div>
            `).join('') : ''}
        `;
      }
      return `
        <div class="nav-item ${item.key === activeSection ? 'active' : ''}" onclick="showSection('${item.key}')">
          ${item.label}${item.stub ? '<span class="tag">建设中</span>' : ''}
        </div>
      `;
    }).join('');
  analytics.innerHTML = render(NAV_ANALYTICS);
  work.innerHTML = render(NAV_WORK);
  sys.innerHTML = render(NAV_SYSTEM);
}

function findNavItem(key) {
  const all = [...NAV_ANALYTICS, ...NAV_WORK, ...NAV_SYSTEM];
  for (const item of all) {
    if (item.key === key) return item;
    if (item.children) {
      const child = item.children.find((c) => c.key === key);
      if (child) return child;
    }
  }
  return null;
}

async function showSection(key) {
  activeSection = key;
  const parentGroup = [...NAV_WORK, ...NAV_SYSTEM].find((i) => i.children && i.children.some((c) => c.key === key));
  if (parentGroup) expandedNavGroups.add(parentGroup.key);
  renderNav();
  document.getElementById('headerLeft').innerHTML = '';
  stopActivityLogPolling();
  ['overview', 'accounts', 'banners', 'users', 'tutorials', 'orders', 'stub'].forEach((k) => {
    document.getElementById(`section-${k}`).hidden = true;
  });

  if (key === 'overview') {
    document.getElementById('section-overview').hidden = false;
    renderAccountSwitcher();
    await renderOverview();
  } else if (key === 'accounts-list') {
    document.getElementById('section-accounts').hidden = false;
    renderAccountsPage();
  } else if (key === 'accounts-add') {
    document.getElementById('section-accounts').hidden = false;
    editingIdentityId = null;
    await renderAddAccountForm();
  } else if (key === 'banners') {
    document.getElementById('section-banners').hidden = false;
    await loadBanners();
    renderBanners();
  } else if (key === 'users-internal') {
    document.getElementById('section-users').hidden = false;
    await loadUsers();
    renderInternalAccounts();
  } else if (key === 'users-external') {
    document.getElementById('section-users').hidden = false;
    await renderExternalAccounts();
  } else if (key === 'tutorials-add') {
    document.getElementById('section-tutorials').hidden = false;
    await renderTutorialsPage();
  } else if (key === 'orders-products') {
    document.getElementById('section-orders').hidden = false;
    await renderProductsPage();
  } else if (key === 'orders-customers') {
    document.getElementById('section-orders').hidden = false;
    await renderCustomersPage();
  } else if (key === 'orders-orders') {
    document.getElementById('section-orders').hidden = false;
    await renderOrdersPage();
  } else if (key === 'orders-aftersales') {
    document.getElementById('section-orders').hidden = false;
    await renderAfterSalesPage();
  } else {
    document.getElementById('section-stub').hidden = false;
    const item = findNavItem(key);
    document.getElementById('section-stub').innerHTML = `<div class="panel"><div class="empty-hint">「${item ? item.label : key}」模块还在开发计划里，暂未上线。</div></div>`;
  }
}

/* ---------------- Account switcher ---------------- */

function platformTagsHtml(identity) {
  return identity.accounts.map((a) => `<span class="mini-tag ${platformBadge(a.platform)}">${platformInitial(a.platform)}</span>`).join('');
}

function renderAccountSwitcher() {
  const current = allIdentities.find((i) => i.id === currentAccountId);
  const label = currentAccountId === 'all' ? '全部账号' : (current ? current.name : currentAccountId);
  const avatarText = currentAccountId === 'all' ? '全' : (current ? current.name[0] : '?');
  document.getElementById('headerLeft').innerHTML = `
    <div class="acc-switcher" id="accSwitcher">
      <button class="acc-switcher-btn" onclick="toggleAccDropdown(event)">
        <span class="acc-avatar">${avatarText}</span>
        <span>${escapeHtml(label)}</span>
        <span class="chevron">▾</span>
      </button>
      <div class="acc-dropdown" id="accDropdown" hidden>
        <div class="acc-dropdown-item" onclick="selectAccount('all')">
          <span class="acc-avatar">全</span> 全部账号
        </div>
        ${allIdentities.map((i) => `
          <div class="acc-dropdown-item" onclick="selectAccount('${i.id}')">
            <span class="acc-avatar">${escapeHtml(i.name[0])}</span> ${escapeHtml(i.name)}
            <span class="acc-sub">${platformTagsHtml(i)} ${fmtNum(i.total_followers)} 粉丝</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleAccDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('accDropdown');
  dd.hidden = !dd.hidden;
}
document.addEventListener('click', () => {
  const dd = document.getElementById('accDropdown');
  if (dd) dd.hidden = true;
});

async function selectAccount(id) {
  currentAccountId = id;
  renderAccountSwitcher();
  await renderOverview();
}

/* ---------------- Overview (经营分析总览) ---------------- */

async function fetchOverview(accountId, period) {
  const key = `${accountId}:${period}`;
  if (overviewCache[key]) return overviewCache[key];
  const res = await fetch(
    `${PUBLIC_API_BASE}/dashboard/overview?account_id=${encodeURIComponent(accountId)}&period=${period}`,
    { headers: { Authorization: `Bearer ${token()}` } },
  );
  if (res.status === 401) { setToken(null); showLogin('登录已过期，请重新登录'); throw new Error('unauthorized'); }
  if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || res.statusText); }
  const data = await res.json();
  overviewCache[key] = data;
  return data;
}

function sparklinePath(series, w, h) {
  if (!series || series.length < 2) return '';
  const min = Math.min(...series);
  const max = Math.max(...series);
  const range = max - min || 1;
  const stepX = w / (series.length - 1);
  return series.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * stepX).toFixed(1)},${(h - ((v - min) / range) * h).toFixed(1)}`).join(' ');
}

const KPI_DEFS = [
  { key: 'videos_published', label: '更新总数', fmt: (v) => Math.round(v).toLocaleString('zh-CN') },
  { key: 'plays', label: '播放总数', fmt: (v) => fmtNum(v) },
  {
    combined: true,
    label: '互动数据',
    parts: [
      { key: 'likes', label: '赞' },
      { key: 'comments', label: '评论' },
      { key: 'shares', label: '转发' },
    ],
  },
  { key: 'new_followers', label: '粉丝关注', fmt: (v) => fmtNum(v) },
  { key: 'ad_spend', label: '投流消耗', fmt: (v) => '¥' + fmtNum(v) },
  { key: 'leads_count', label: '后台线索', fmt: (v) => fmtNum(v) },
  { key: 'wechat_added', label: '私域添加', fmt: (v) => fmtNum(v) },
];

let currentDiagnosis = null;
let currentVideos = [];
let selectedVideoId = null;

function staticUrl(path) { return `/admin${path}`; }

async function renderOverview() {
  const el = document.getElementById('section-overview');
  el.innerHTML = `<div class="empty-hint">加载中...</div>`;
  let data;
  try {
    data = await fetchOverview(currentAccountId, 7);
  } catch (e) {
    el.innerHTML = `<div class="empty-hint">加载失败：${escapeHtml(e.message)}</div>`;
    return;
  }
  trendPeriod = 7;
  currentDiagnosis = data.diagnosis;
  selectedVideoId = null;

  const alertsHtml = data.alerts.length
    ? `<div class="alert-banner" id="alertBanner">⚠ ${data.alerts.length}项经营异常需要关注：${data.alerts.map(escapeHtml).join(' · ')}
        <button class="close-btn" onclick="document.getElementById('alertBanner').remove()">✕</button>
      </div>`
    : '';

  el.innerHTML = `
    <div class="page-title">经营分析总览</div>
    <div class="page-sub">${escapeHtml(data.account_label)} · 数据每天自动更新一次</div>
    ${alertsHtml}
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="overview-grid">
      <div class="panel video-panel">
        <h2>视频内容</h2>
        <div class="page-sub" style="margin-bottom:12px;">点击视频封面，右侧切换为该视频的 DeepSeek 分析</div>
        <div class="video-strip" id="videoStrip"><div class="empty-hint">加载中...</div></div>
      </div>
      <div class="panel diagnosis-panel" id="diagnosisPanel"></div>
      <div class="panel trend-panel">
        <div class="panel-head-row">
          <h2>播放量 / 涨粉趋势</h2>
          <div class="period-toggle">
            <button id="pt7" class="active" onclick="setTrendPeriod(7)">7天</button>
            <button id="pt30" onclick="setTrendPeriod(30)">30天</button>
          </div>
        </div>
        <svg class="trend-chart" id="trendChart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg>
      </div>
    </div>
  `;
  renderKpiGrid(data.today_metrics);
  renderTrendChart(data.trend);
  renderDiagnosisPanel();
  loadVideoStrip();
}

function renderDiagnosisPanel() {
  const panel = document.getElementById('diagnosisPanel');
  if (!panel) return;
  const video = selectedVideoId ? currentVideos.find((v) => v.id === selectedVideoId) : null;
  if (video) {
    panel.innerHTML = `
      <button class="diagnosis-back" onclick="clearSelectedVideo()">‹ 返回账号总览诊断</button>
      <div class="video-preview-916" onclick="playVideoPlaceholder()">
        <img src="${staticUrl(video.poster_url)}" alt="">
        <div class="preview-overlay"><span class="play-badge">▶</span></div>
      </div>
      <p class="msg preview-play-msg" id="previewPlayMsg"></p>
      <h2>${escapeHtml(video.title)}</h2>
      <div class="video-stats-row">
        <span>播放 ${fmtNum(video.plays)}</span>
        <span>赞 ${fmtNum(video.likes)}</span>
        <span>评论 ${fmtNum(video.comments)}</span>
        <span>转发 ${fmtNum(video.shares)}</span>
      </div>
      <div class="diagnosis-block">
        <span class="diagnosis-tag opportunity">DeepSeek 分析</span>
        <span class="diagnosis-text">${escapeHtml(video.deepseek_analysis)}</span>
      </div>
    `;
  } else {
    panel.innerHTML = `
      <h2>DeepSeek 智能经营诊断</h2>
      <div class="diagnosis-meta">${currentDiagnosis.model} · ${currentDiagnosis.based_on}生成（示例分析，未接入真实模型）</div>
      <div class="diagnosis-block">
        <span class="diagnosis-tag risk">风险</span>
        <span class="diagnosis-text">${escapeHtml(currentDiagnosis.risk)}</span>
      </div>
      <div class="diagnosis-block">
        <span class="diagnosis-tag opportunity">机会</span>
        <span class="diagnosis-text">${escapeHtml(currentDiagnosis.opportunity)}</span>
      </div>
    `;
  }
}

function playVideoPlaceholder() {
  const msg = document.getElementById('previewPlayMsg');
  if (msg) { msg.textContent = '示例数据，暂无真实视频源，接入抓取的视频文件后可直接播放'; }
}

function clearSelectedVideo() {
  selectedVideoId = null;
  renderDiagnosisPanel();
  renderVideoStripActiveState();
}

async function loadVideoStrip() {
  try {
    currentVideos = currentAccountId === 'all'
      ? await fetch(`${PUBLIC_API_BASE}/videos`).then((r) => r.json())

function deltaBadge(m) {
  const up = m.change_pct >= 0;
  return `<span class="kpi-delta ${up ? 'up' : 'down'}">${up ? '↗' : '↘'} ${Math.abs(m.change_pct)}%</span>`;
}

function renderKpiGrid(todayMetrics) {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = KPI_DEFS.map((def) => {
    if (def.combined) {
      return `
        <div class="kpi-card">
          <span class="kpi-label">${def.label}</span>
          <div class="kpi-combined">
            ${def.parts.map((p) => {
              const m = todayMetrics[p.key];
              return `
                <div class="kpi-combined-item">
                  <span class="kpi-combined-label">${p.label}</span>
                  <span class="kpi-combined-val">${fmtNum(m.value)}</span>
                  ${deltaBadge(m)}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
    const m = todayMetrics[def.key];
    const up = m.change_pct >= 0;
    const color = up ? '#34d399' : '#f472b6';
    const path = sparklinePath(m.series, 200, 36);
    return `
      <div class="kpi-card">
        <span class="kpi-label">${def.label}</span>
        <span class="kpi-value">${def.fmt(m.value)}</span>
        ${deltaBadge(m)}
        <svg class="kpi-spark" viewBox="0 0 200 36" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
        </svg>
      </div>
    `;
  }).join('');
}

function renderTrendChart(trend) {
  const svg = document.getElementById('trendChart');
  if (!svg) return;
  const W = 640, H = 220, padL = 56, padR = 16, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const all = [...trend.plays, ...trend.new_followers];
  const max = Math.max(...all, 1);
  const min = 0;
  const n = trend.dates.length;
  const stepX = n > 1 ? plotW / (n - 1) : 0;
  const scaleY = (v) => padT + plotH - ((v - min) / (max - min || 1)) * plotH;
  const scaleX = (i) => padL + i * stepX;

  const line = (series) => series.map((v, i) => `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(1)},${scaleY(v).toFixed(1)}`).join(' ');

  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + plotH * (1 - f);
    const val = Math.round(max * f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2a3040" stroke-width="1"/>
            <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#5b6377">${fmtNum(val)}</text>`;
  }).join('');

  const xLabels = trend.dates.map((d, i) => {
    if (n > 10 && i % Math.ceil(n / 6) !== 0) return '';
    return `<text x="${scaleX(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5b6377">${d}</text>`;
  }).join('');

  const lastPlays = trend.plays[trend.plays.length - 1];
  const lastFollowers = trend.new_followers[trend.new_followers.length - 1];

  svg.innerHTML = `
    ${gridLines}
    ${xLabels}
    <path d="${line(trend.plays)}" fill="none" stroke="#4f7dfa" stroke-width="2.5"/>
    <path d="${line(trend.new_followers)}" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="${scaleX(n - 1)}" cy="${scaleY(lastPlays)}" r="4" fill="#4f7dfa"/>
    <circle cx="${scaleX(n - 1)}" cy="${scaleY(lastFollowers)}" r="4" fill="#f59e0b"/>
    <text x="${scaleX(n - 1) - 8}" y="${scaleY(lastPlays) - 10}" text-anchor="end" font-size="11" fill="#4f7dfa" font-weight="700">${fmtNum(lastPlays)}</text>
    <text x="${scaleX(n - 1) - 8}" y="${scaleY(lastFollowers) - 10}" text-anchor="end" font-size="11" fill="#f59e0b" font-weight="700">${fmtNum(lastFollowers)}</text>
  `;
}

    input.disabled = false;
    input.hidden = false;
    display.hidden = true;
    btn.textContent = '确定添加';
    btn.classList.remove('locked-btn');
  } else {
    if (!input.value.trim()) { alert('您还没有输入网址'); return; }

    input.disabled = true;
    input.hidden = true;
    display.textContent = url;

    btn.textContent = '修改编辑';

  }
}

async function submitNewIdentity() {
  const msg = document.getElementById('newIdentityMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';

  const name = document.getElementById('newIdentityName').value.trim();
  const operatorUserId = document.getElementById('newIdentityOperator').value || null;
  if (!name) {
    msg.textContent = '请填写矩阵号名称';
    msg.className = 'msg error';
    return;
  }

  const platformUrls = {};
  PLATFORM_DEFS.forEach((p) => {
    platformUrls[p.key] = document.getElementById(`newAcc_${p.key}_url`).value.trim() || null;
  });

  try {
    if (editingIdentityId) {
      const id = editingIdentityId;
      const identity = await publicApi(`/identities/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });

      if (operatorUserId !== editingOperatorOriginalId) {
        try {
          if (editingOperatorOriginalId) {
            await publicApi(`/users/${editingOperatorOriginalId}/identities/${id}`, { method: 'DELETE' });
          }
          if (operatorUserId) {
            await publicApi(`/users/${operatorUserId}/identities`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identity_id: id }),
            });
          }
        } catch (e) {
          msg.textContent = '基本信息和链接已保存，但运营账号关联需要超级管理员权限，没有改成';
          msg.className = 'msg error';
        }
      }

      for (const p of PLATFORM_DEFS) {
        const url = platformUrls[p.key];
        const existingAcc = identity.accounts.find((a) => a.platform === p.key);
        if (url) {
          if (existingAcc) {
            await publicApi(`/accounts/${existingAcc.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ nickname: existingAcc.nickname, profile_url: url, follower_count: existingAcc.follower_count, video_count: existingAcc.video_count }),
            });
          } else {
            await publicApi('/accounts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identity_id: id, platform: p.key, profile_url: url, nickname: '', follower_count: 0, video_count: 0 }),
            });
          }
        } else if (existingAcc && existingAcc.profile_url) {
          // Only remove the account if it previously had a link that's now being
          // cleared. An existing account with no profile_url (legacy data, never
          // touched by this form) is left alone — an empty field here must never
          // silently delete real follower/video data.
          await publicApi(`/accounts/${existingAcc.id}`, { method: 'DELETE' });
        }
      }

      allIdentities = await fetch(`${PUBLIC_API_BASE}/identities`).then((r) => r.json());
      editingIdentityId = null;
      if (!msg.className.includes('error')) { msg.textContent = '已保存'; msg.className = 'msg ok'; }
      setTimeout(() => showSection('accounts-list'), 800);
    } else {
      const identity = await publicApi('/identities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, operator_user_id: operatorUserId }),
      });
      for (const p of PLATFORM_DEFS) {
        if (!platformUrls[p.key]) continue;
        await publicApi('/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity_id: identity.id, platform: p.key, profile_url: platformUrls[p.key] }),
        });
      }
      allIdentities = await fetch(`${PUBLIC_API_BASE}/identities`).then((r) => r.json());
      msg.textContent = '添加成功';
      msg.className = 'msg ok';
      setTimeout(() => showSection('accounts-list'), 600);
    }
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

  const modal = document.getElementById('passcodeModal');
  modal.innerHTML = `
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>需要管理口令</h2>
      <div class="page-sub" style="margin-bottom:16px;">进入「${escapeHtml(identity ? identity.name : id)}」需要输入这个矩阵号的管理口令</div>
      <input type="text" id="identityPasscodeInput" placeholder="输入管理口令"
             onkeydown="if(event.key==='Enter'){submitIdentityPasscode('${id}')}">
      <div class="actions">
        <button onclick="submitIdentityPasscode('${id}')">进入</button>
        <button class="ghost" onclick="closePasscodeModal()">取消</button>
      </div>
      <p class="msg" id="identityPasscodeMsg"></p>
    </div>
  `;
  modal.hidden = false;
  document.getElementById('identityPasscodeInput').focus();
}

function closePasscodeModal() {
  const modal = document.getElementById('passcodeModal');
  modal.hidden = true;
  modal.innerHTML = '';
}

async function submitIdentityPasscode(id) {
  const input = document.getElementById('identityPasscodeInput');
  const msg = document.getElementById('identityPasscodeMsg');
  const passcode = input.value.trim();
  if (!passcode) { msg.textContent = '请输入口令'; msg.className = 'msg error'; return; }
  msg.className = 'msg';
  msg.textContent = '验证中...';
  try {
    const res = await fetch(`${PUBLIC_API_BASE}/identities/${id}/verify-passcode`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token()}` },
      body: JSON.stringify({ passcode }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || '验证失败');
    }
    unlockedIdentities.add(id);
    closePasscodeModal();
    accountsDetailId = id;
    detailActiveAccountId = null;
    detailSelectedVideoId = null;
    renderIdentityDetail(id);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

        <div class="actions">
          <button onclick="submitBanner()">保存</button>
          <button class="ghost" onclick="resetBannerForm()">清空</button>

        <p class="msg" id="bannerFormMsg"></p>
      </div>

function renderBannerList() {
  const list = document.getElementById('bannerList');
  if (!banners.length) { list.innerHTML = '<div class="empty-hint">暂无轮播图</div>'; return; }
  list.innerHTML = banners.slice().sort((a, b) => a.sort_order - b.sort_order).map((b) => `
    <div class="row-item">
      <img src="${staticUrl(b.image_url)}" alt="">
      <div class="row-body">
        <div class="row-title">${escapeHtml(b.title)}</div>
        <div class="row-sub">${escapeHtml(b.subtitle || '')} · 排序 ${b.sort_order}</div>
      </div>
      <div class="row-btns">
        <button class="ghost" onclick="editBanner('${b.id}')">编辑</button>
        <button class="danger" onclick="deleteBanner('${b.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function previewBannerImage() {
  const file = document.getElementById('fImage').files[0];
  const preview = document.getElementById('fImagePreview');
  if (!file) { preview.hidden = true; preview.src = ''; return; }
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
}

function editBanner(id) {
  const b = banners.find((x) => x.id === id);
  if (!b) return;
  editingBannerId = id;
  document.getElementById('bannerFormTitle').textContent = '编辑轮播图';
  document.getElementById('fTitle').value = b.title;
  document.getElementById('fSubtitle').value = b.subtitle || '';
  document.getElementById('fSort').value = b.sort_order;
  document.getElementById('fLink').value = b.link_url || '';
  document.getElementById('fImageUrl').value = b.image_url;
  document.getElementById('fImage').value = '';
  const preview = document.getElementById('fImagePreview');
  preview.src = staticUrl(b.image_url);
  preview.hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetBannerForm() {
  editingBannerId = null;
  document.getElementById('bannerFormTitle').textContent = '新增轮播图';
  ['fTitle', 'fSubtitle', 'fLink', 'fImageUrl'].forEach((id) => { document.getElementById(id).value = ''; });
  document.getElementById('fSort').value = '0';
  document.getElementById('fImage').value = '';
  document.getElementById('fImagePreview').hidden = true;
  document.getElementById('fImagePreview').src = '';
  document.getElementById('bannerFormMsg').textContent = '';
}

async function deleteBanner(id) {
  if (!confirm('确定删除这条轮播图吗？')) return;
  await api(`/banners/${id}`, { method: 'DELETE' });
  await loadBanners();
  renderBannerList();
}

async function submitBanner() {
  const msg = document.getElementById('bannerFormMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';
  try {
    let imageUrl = document.getElementById('fImageUrl').value;
    const file = document.getElementById('fImage').files[0];
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      const uploadRes = await api('/upload', { method: 'POST', body: fd });
      imageUrl = uploadRes.url;
    }
    if (!imageUrl) { msg.textContent = '请上传图片'; msg.className = 'msg error'; return; }
    const payload = {
      title: document.getElementById('fTitle').value.trim(),
      subtitle: document.getElementById('fSubtitle').value.trim(),
      image_url: imageUrl,
      link_url: document.getElementById('fLink').value.trim() || null,
      sort_order: Number(document.getElementById('fSort').value) || 0,
    };
    if (!payload.title) { msg.textContent = '请填写标题'; msg.className = 'msg error'; return; }
    if (editingBannerId) {
      await api(`/banners/${editingBannerId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      await api('/banners', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    msg.textContent = '已保存';
    msg.className = 'msg ok';
    resetBannerForm();
    await loadBanners();
    renderBannerList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

let tutorialQuill = null;

function initTutorialEditor() {
  tutorialQuill = new Quill('#tContentEditor', {
    theme: 'snow',
    placeholder: '教程正文，支持标题/加粗/列表/链接/图片',
    modules: {
      toolbar: {
        container: [
          [{ header: [2, 3, false] }],
          ['bold', 'italic', 'underline'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'image'],
          ['clean'],
        ],
        handlers: { image: quillImageHandler },
      },
    },
  });
}

function quillImageHandler() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const range = tutorialQuill.getSelection(true);
    const msg = document.getElementById('tutorialFormMsg');
    msg.className = 'msg';
    msg.textContent = '图片上传中...';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await api('/upload', { method: 'POST', body: fd });
      tutorialQuill.insertEmbed(range.index, 'image', res.url, 'user');
      tutorialQuill.setSelection(range.index + 1);
      msg.textContent = '';
    } catch (e) {
      msg.textContent = '图片上传失败：' + e.message;
      msg.className = 'msg error';
    }
  };
  input.click();
}

function renderTutorialList() {
  const list = document.getElementById('tutorialList');
  if (!tutorials.length) { list.innerHTML = '<div class="empty-hint">还没有教程文章</div>'; return; }
  list.innerHTML = tutorials.map((t) => `
    <div class="tutorial-list-item">
      <span class="tag">${TUTORIAL_PLATFORM_LABELS[t.platform] || t.platform}</span>
      <div class="row-body">
        <div class="row-title">${escapeHtml(t.title)}</div>
        <div class="row-sub">排序 ${t.sort_order}</div>
      </div>
      <div class="row-btns">
        <button class="ghost" onclick="editTutorial('${t.id}')">编辑</button>
        <button class="danger" onclick="deleteTutorial('${t.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function editTutorial(id) {
  const t = tutorials.find((x) => x.id === id);
  if (!t) return;
  editingTutorialId = id;
  document.getElementById('tutorialFormTitle').textContent = '编辑教程';
  document.getElementById('tPlatform').value = t.platform;
  document.getElementById('tSort').value = t.sort_order;
  document.getElementById('tTitle').value = t.title;
  document.getElementById('tCoverImageUrl').value = t.cover_image_url || '';
  tutorialQuill.root.innerHTML = t.content || '';
  window.scrollTo({ top: document.getElementById('tutorialFormTitle').offsetTop, behavior: 'smooth' });
}

function resetTutorialForm() {
  editingTutorialId = null;
  document.getElementById('tutorialFormTitle').textContent = '新增教程';
  document.getElementById('tPlatform').value = 'general';
  document.getElementById('tSort').value = '0';
  document.getElementById('tTitle').value = '';
  document.getElementById('tCoverImageUrl').value = '';
  document.getElementById('tCoverImage').value = '';
  if (tutorialQuill) tutorialQuill.root.innerHTML = '';
  document.getElementById('tutorialFormMsg').textContent = '';
}

async function deleteTutorial(id) {
  if (!confirm('确定删除这篇教程吗？')) return;
  await api(`/tutorials/${id}`, { method: 'DELETE' });
  await loadTutorials();
  renderTutorialList();
}

async function submitTutorial() {
  const msg = document.getElementById('tutorialFormMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';
  try {
    let coverImageUrl = document.getElementById('tCoverImageUrl').value || null;
    const coverFile = document.getElementById('tCoverImage').files[0];
    if (coverFile) {
      const fd = new FormData();
      fd.append('file', coverFile);
      const uploadRes = await api('/upload', { method: 'POST', body: fd });
      coverImageUrl = uploadRes.url;
    }
    const payload = {
      platform: document.getElementById('tPlatform').value,
      title: document.getElementById('tTitle').value.trim(),
      cover_image_url: coverImageUrl,
      content: tutorialQuill.root.innerHTML,
      sort_order: Number(document.getElementById('tSort').value) || 0,
    };
    if (!payload.title) { msg.textContent = '请填写标题'; msg.className = 'msg error'; return; }
    if (!tutorialQuill.getText().trim()) { msg.textContent = '请填写正文内容'; msg.className = 'msg error'; return; }
    if (editingTutorialId) {
      await api(`/tutorials/${editingTutorialId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      await api('/tutorials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    msg.textContent = '已保存';
    msg.className = 'msg ok';
    resetTutorialForm();
    await loadTutorials();
    renderTutorialList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

function isImageUrl(url) {
  return /\.(png|jpe?g|gif|svg|webp)$/i.test(url || '');
}

function previewProductFile(inputId, previewImgId, nameElId) {
  const file = document.getElementById(inputId).files[0];
  const img = document.getElementById(previewImgId);
  const nameEl = document.getElementById(nameElId);
  if (!file) { img.hidden = true; img.src = ''; nameEl.hidden = true; nameEl.textContent = ''; return; }
  if (file.type.startsWith('image/')) {
    img.src = URL.createObjectURL(file);
    img.hidden = false;
    nameEl.hidden = true;
    nameEl.textContent = '';
  } else {
    img.hidden = true;
    img.src = '';
    nameEl.hidden = false;
    nameEl.textContent = '已选择文件：' + file.name;
  }
}

function setImageEditButtonVisible(inputId, visible) {
  const btn = document.getElementById(inputId + 'EditBtn');
  if (btn) btn.hidden = !visible;
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function computeCoverCrop(nw, nh) {
  const minScale = Math.max(CROP_VW / nw, CROP_VH / nh);
  return {
    naturalW: nw, naturalH: nh, scale: minScale, minScale, maxScale: minScale * 3,
    left: (CROP_VW - nw * minScale) / 2,
    top: (CROP_VH - nh * minScale) / 2,
  };
}

async function cropImageElementToBlob(imgEl, state) {
  const OUT_W = 720, OUT_H = 1280;
  const canvas = document.createElement('canvas');
  canvas.width = OUT_W;
  canvas.height = OUT_H;
  const ctx = canvas.getContext('2d');
  const sx = -state.left / state.scale;
  const sy = -state.top / state.scale;
  const sw = CROP_VW / state.scale;
  const sh = CROP_VH / state.scale;
  ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);

  const maxBytes = 200 * 1024;
  let quality = 0.9;
  let blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
  while (blob && blob.size > maxBytes && quality > 0.3) {
    quality -= 0.1;
    blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
  }
  return blob;
}

function setCroppedResult(inputId, previewImgId, nameElId, blob) {
  pendingProductFiles[inputId] = new File([blob], 'crop-' + Date.now() + '.jpg', { type: 'image/jpeg' });
  const previewImg = document.getElementById(previewImgId);
  const nameEl = document.getElementById(nameElId);
  previewImg.src = URL.createObjectURL(blob);
  previewImg.hidden = false;
  nameEl.hidden = true;
  nameEl.innerHTML = '';
  setImageEditButtonVisible(inputId, true);
}

async function autoCropAndSet(file, inputId, previewImgId, nameElId) {
  const img = await loadImageFromFile(file);
  const state = computeCoverCrop(img.naturalWidth, img.naturalHeight);
  const blob = await cropImageElementToBlob(img, state);
  URL.revokeObjectURL(img.src);
  if (!blob) return;
  setCroppedResult(inputId, previewImgId, nameElId, blob);
}

function handleProductImageSelect(inputId, previewImgId, nameElId, allowCrop) {
  const file = document.getElementById(inputId).files[0];
  if (!file) return;
  if (file.type.startsWith('image/') && allowCrop) {
    pendingProductOriginals[inputId] = file;
    autoCropAndSet(file, inputId, previewImgId, nameElId);
  } else {
    delete pendingProductFiles[inputId];
    delete pendingProductOriginals[inputId];
    previewProductFile(inputId, previewImgId, nameElId);
  }
}

async function editProductImage(inputId, previewImgId, nameElId) {

function openImageCropper(file, inputId, previewImgId, nameElId) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const modal = document.getElementById('passcodeModal');
    modal.innerHTML = `
      <div class="modal-card wide" onclick="event.stopPropagation()">
        <h2>裁剪主图（9:16）</h2>
        <div class="crop-viewport" id="cropViewport"><img id="cropImg" src="${e.target.result}" draggable="false"></div>
        <div class="crop-controls">
          <label class="row-sub">缩放</label>
          <input type="range" id="cropZoom" min="0" max="100" value="0">
        </div>
        <p class="row-sub">拖动图片调整位置，拉动滑块缩放；保存时会自动裁剪为 9:16 并压缩到约 200KB</p>
        <div class="actions">
          <button onclick="confirmCrop('${inputId}','${previewImgId}','${nameElId}')">裁剪并保存</button>
          <button class="ghost" onclick="cancelCrop('${inputId}')">取消</button>
        </div>
        <p class="msg" id="cropMsg"></p>
      </div>
    `;
    modal.hidden = false;
    initCropper();
  };
  reader.readAsDataURL(file);
}

function initCropper() {
  const img = document.getElementById('cropImg');
  const zoomSlider = document.getElementById('cropZoom');

  const onImgLoad = () => {
    const nw = img.naturalWidth, nh = img.naturalHeight;
    const minScale = Math.max(CROP_VW / nw, CROP_VH / nh);
    cropState = { naturalW: nw, naturalH: nh, scale: minScale, minScale, maxScale: minScale * 3, left: 0, top: 0 };
    cropState.left = (CROP_VW - nw * minScale) / 2;
    cropState.top = (CROP_VH - nh * minScale) / 2;
    applyCropTransform();
    zoomSlider.value = 0;
  };
  if (img.complete && img.naturalWidth) onImgLoad(); else img.onload = onImgLoad;

  let dragging = false;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;
  img.onpointerdown = (ev) => {
    if (!cropState) return;
    dragging = true;
    startX = ev.clientX; startY = ev.clientY;
    startLeft = cropState.left; startTop = cropState.top;
    img.setPointerCapture(ev.pointerId);
  };
  img.onpointermove = (ev) => {
    if (!dragging || !cropState) return;
    cropState.left = startLeft + (ev.clientX - startX);
    cropState.top = startTop + (ev.clientY - startY);
    clampCrop();
    applyCropTransform();
  };
  img.onpointerup = () => { dragging = false; };
  img.onpointercancel = () => { dragging = false; };

  zoomSlider.oninput = () => {
    if (!cropState) return;
    const t = zoomSlider.value / 100;
    const newScale = cropState.minScale + t * (cropState.maxScale - cropState.minScale);
    const cx = CROP_VW / 2, cy = CROP_VH / 2;
    const imgX = (cx - cropState.left) / cropState.scale;
    const imgY = (cy - cropState.top) / cropState.scale;
    cropState.scale = newScale;
    cropState.left = cx - imgX * newScale;
    cropState.top = cy - imgY * newScale;
    clampCrop();
    applyCropTransform();
  };
}

function clampCrop() {
  const w = cropState.naturalW * cropState.scale;
  const h = cropState.naturalH * cropState.scale;
  if (cropState.left > 0) cropState.left = 0;
  if (cropState.left + w < CROP_VW) cropState.left = CROP_VW - w;
  if (cropState.top > 0) cropState.top = 0;
  if (cropState.top + h < CROP_VH) cropState.top = CROP_VH - h;
}

function applyCropTransform() {
  const img = document.getElementById('cropImg');
  if (!img || !cropState) return;
  img.style.width = (cropState.naturalW * cropState.scale) + 'px';
  img.style.height = (cropState.naturalH * cropState.scale) + 'px';
  img.style.left = cropState.left + 'px';
  img.style.top = cropState.top + 'px';
}

async function confirmCrop(inputId, previewImgId, nameElId) {

  if (!blob) { msg.textContent = '裁剪失败，请重试'; msg.className = 'msg error'; return; }
  setCroppedResult(inputId, previewImgId, nameElId, blob);
  cropState = null;
  closePasscodeModal();
}

function uploadFileWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${API_BASE}/upload`);
    xhr.setRequestHeader('Authorization', `Bearer ${token()}`);
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && onProgress) onProgress(Math.round((ev.loaded / ev.total) * 100));
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(new Error('解析响应失败')); }
      } else if (xhr.status === 401) {
        setToken(null);
        showLogin('登录已过期，请重新登录');
        reject(new Error('unauthorized'));
      } else {
        let detail = xhr.statusText || ('HTTP ' + xhr.status);
        try { detail = JSON.parse(xhr.responseText).detail || detail; } catch (e) {}
        reject(new Error(detail));
      }
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    const fd = new FormData();
    fd.append('file', file);
    xhr.send(fd);
  });
}

async function uploadProductImage(inputId) {
  const file = pendingProductFiles[inputId] || document.getElementById(inputId).files[0];
  if (!file) return null;
  const progressWrap = document.getElementById(inputId + 'Progress');
  const progressBar = document.getElementById(inputId + 'ProgressBar');
  const progressText = document.getElementById(inputId + 'ProgressText');
  if (progressWrap) { progressWrap.hidden = false; progressBar.style.width = '0%'; progressText.textContent = '0%'; }
  try {
    const res = await uploadFileWithProgress(file, (pct) => {
      if (progressBar) progressBar.style.width = pct + '%';
      if (progressText) progressText.textContent = pct + '%';
    });
    return res.url;
  } finally {
    if (progressWrap) progressWrap.hidden = true;
  }
}

let brandName = '房车';

async function loadSettings() {
  try {

    if (res.ok) { brandName = (await res.json()).brand_name || '房车'; }
  } catch (e) {}
  renderBrand();

function renderBrand() {
  document.getElementById('brandPart').textContent = brandName;

function startEditBrand() {
  document.getElementById('brandPart').hidden = true;
  const input = document.getElementById('brandInput');
  input.value = brandName;
  input.hidden = false;
  input.focus();
  input.select();
}

function showBrandDisplay() {
  document.getElementById('brandPart').hidden = false;
  document.getElementById('brandInput').hidden = true;
}

function cancelEditBrand() {
  suppressBlurSave = true;
  showBrandDisplay();
  setTimeout(() => { suppressBlurSave = false; }, 0);
}

  if (suppressBlurSave) return;
  const val = document.getElementById('brandInput').value.trim();

    brandName = val;
    renderBrand();
  } catch (e) {
    alert('保存失败：' + e.message);
  } finally {
    showBrandDisplay();
  }
}
