<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号矩阵中枢 · 管理台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css">
<style>
  :root {
    --bg: #0f1218;
    --sidebar: #12151f;
    --card: #1a1e2b;
    --card-2: #232838;
    --line: #2a3040;
    --ink: #e8eaf0;
    --ink-soft: #8890a3;
    --ink-faint: #5b6377;
    --accent: #4f7dfa;
    --accent-soft: rgba(79, 125, 250, 0.16);
    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.14);
    --danger: #f472b6;
    --danger-soft: rgba(244, 114, 182, 0.14);
    --warning: #eab308;
    --warning-soft: rgba(234, 179, 8, 0.12);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  [hidden] { display: none !important; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button.link-confirm-btn { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); }
  button.link-confirm-btn.locked-btn { background: var(--accent); color: #fff; border: none; }
  input[type="text"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; }
  .field-preview-img { margin-top: 10px; max-width: 240px; max-height: 120px; border-radius: 8px; display: block; }
  label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--success); }
  input[type="text"]:disabled { background: rgba(255, 255, 255, 0.03); color: var(--ink-faint); cursor: not-allowed; }

  .p-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex-shrink: 0;
  }
  .link-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -2px; }
  .link-locked-text { font-size: 14px; line-height: 1.5; word-break: break-all; padding: 2px 0; color: #fff; }
  .link-tutorial { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: none; }
  .link-tutorial:hover { text-decoration: underline; }
  .modal-card.wide { max-width: 640px; max-height: 82vh; overflow-y: auto; }
  .tutorial-title { font-size: 16px; font-weight: 700; margin: 4px 0 12px; }
  .tutorial-content { font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
  .tutorial-content img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
  .tutorial-content p { margin: 0 0 10px; }
  .tutorial-content h2, .tutorial-content h3 { color: var(--ink); margin: 14px 0 8px; }
  .tutorial-content ul, .tutorial-content ol { margin: 0 0 10px; padding-left: 22px; }
  .tutorial-content a { color: var(--accent); }
  .tutorial-list-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .tutorial-list-item:last-child { border-bottom: none; }
  .tutorial-list-item .row-body { flex: 1; min-width: 0; }
  .tutorial-list-item .tag {
    font-size: 10px; color: var(--ink-faint); background: rgba(255, 255, 255, 0.06);
    padding: 1px 6px; border-radius: 999px;
  }

  /* ---------- Quill editor (dark theme override) ---------- */
  .ql-toolbar.ql-snow { border-color: var(--line); background: var(--card-2); border-radius: 8px 8px 0 0; }
  .ql-container.ql-snow { border-color: var(--line); border-radius: 0 0 8px 8px; font-size: 14px; }
  .ql-editor { min-height: 220px; color: var(--ink); }
  .ql-editor.ql-blank::before { color: var(--ink-faint); font-style: normal; }
  .ql-snow .ql-stroke { stroke: var(--ink-soft); }
  .ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill { fill: var(--ink-soft); }
  .ql-snow .ql-picker { color: var(--ink-soft); }
  .ql-snow .ql-picker-options { background: var(--card); border-color: var(--line) !important; }
  .ql-snow .ql-tooltip { background: var(--card); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
  .ql-snow .ql-tooltip input[type="text"] { background: var(--card-2); color: var(--ink); border-color: var(--line); }
  .ql-snow .ql-toolbar button:hover .ql-stroke, .ql-snow .ql-toolbar button.ql-active .ql-stroke { stroke: var(--accent); }
  .ql-snow .ql-toolbar button:hover .ql-fill, .ql-snow .ql-toolbar button.ql-active .ql-fill { fill: var(--accent); }
  .ql-editor img { max-width: 100%; border-radius: 8px; }

  /* ---------- Login ---------- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 32px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p.hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }

  /* ---------- Shell ---------- */
  /* Sidebar is a fixed overlay (out of document flow) so the page uses
     normal browser scrolling — only .main-area's left margin moves to make
     room for it, nothing gets its own inner scroll container. */
  .shell { min-height: 100vh; }
  .sidebar {
    width: 220px;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    overflow-y: auto;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    z-index: 50;
  }
  .brand-block { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.3; }
  .brand-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .brand-sub { font-size: 12px; font-weight: 500; color: var(--ink-faint); }
  .brand-box {
    border: 1px dashed transparent;
    border-radius: 5px;
    padding: 0 4px;
    cursor: pointer;
  }
  .brand-box.editable { border-color: var(--line); }
  .brand-box.editable:hover { border-color: var(--accent); background: var(--accent-soft); }
  #brandInput { width: 96px; padding: 1px 6px; font-size: 15px; font-weight: 700; border-radius: 5px; }

  .nav-group-label { font-size: 11px; color: var(--ink-faint); padding: 14px 12px 6px; letter-spacing: 0.04em; }
  .nav-item {
    padding: 10px 12px; border-radius: 10px; font-size: 14px;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.04); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .tag {
    font-size: 10px; color: var(--ink-faint); background: rgba(255, 255, 255, 0.06);
    padding: 1px 6px; border-radius: 999px; margin-left: auto;
  }
  .nav-item .nav-caret { margin-left: auto; font-size: 18px; line-height: 1; color: var(--ink-soft); font-weight: 700; }
  .nav-item.nav-child { padding-left: 28px; font-size: 13px; }

  .main-area { min-width: 0; margin-left: 220px; display: flex; flex-direction: column; }
  .content-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-soft); }
  .role-badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .stage-pill { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; margin-left: 6px; display: inline-block; }
  .stage-early { background: var(--accent-soft); color: var(--accent); }
  .stage-mid { background: rgba(230, 160, 40, 0.18); color: #d99a28; }
  .stage-late { background: var(--success-soft); color: var(--success); }
  .stage-done { background: #05070c; color: #fff; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; }
  .content-body { padding: 24px 28px 80px; max-width: 1200px; }

  /* ---------- Account switcher ---------- */
  .acc-switcher { position: relative; }
  .acc-switcher-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
    font-weight: 600; font-size: 14px;
  }
  .acc-avatar {
    width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  .chevron { color: var(--ink-faint); font-size: 11px; }
  .acc-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 220px; max-height: 320px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 20;
  }
  .acc-dropdown-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; cursor: pointer;
  }
  .acc-dropdown-item:hover { background: rgba(255, 255, 255, 0.05); }
  .acc-dropdown-item .acc-sub { font-size: 11px; color: var(--ink-faint); margin-left: auto; }

  /* ---------- Overview page ---------- */
  .page-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .page-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }

  .alert-banner {
    display: flex; align-items: center; gap: 10px; background: var(--warning-soft); border: 1px solid rgba(234,179,8,0.3);
    color: var(--warning); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px;
  }
  .alert-banner .close-btn { margin-left: auto; background: transparent; color: var(--warning); padding: 0 4px; font-size: 15px; }

  /* kpi-grid and overview-grid share a 7-column template (matching the
     current 7 KPI cards) so the panels below line up with specific cards:
     video/trend under cards 1-5, diagnosis under cards 6-7. If the KPI
     card count changes, update both the column count and the spans below. */
  .kpi-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .kpi-label { font-size: 12px; color: var(--ink-soft); }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .kpi-delta { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; width: fit-content; }
  .kpi-delta.up { background: var(--success-soft); color: var(--success); }
  .kpi-delta.down { background: var(--danger-soft); color: var(--danger); }
  .kpi-spark { width: 100%; height: 36px; }
  .kpi-combined { display: flex; flex-direction: column; gap: 8px; }
  .kpi-combined-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .kpi-combined-label { font-size: 12px; color: var(--ink-soft); width: 30px; flex-shrink: 0; }
  .kpi-combined-val { font-size: 17px; font-weight: 700; flex: 1; }
  .kpi-combined .kpi-delta { font-size: 10px; padding: 1px 6px; flex-shrink: 0; }

  .overview-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto auto;
    gap: 16px; align-items: stretch; margin-top: 20px;
  }
  .overview-grid .video-panel { grid-column: 1 / span 5; grid-row: 1; }
  .overview-grid .trend-panel { grid-column: 1 / span 5; grid-row: 2; }
  .overview-grid .diagnosis-panel { grid-column: 6 / span 2; grid-row: 1 / span 2; display: flex; flex-direction: column; }
  @media (max-width: 1024px) {
    .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .overview-grid { grid-template-columns: 1fr; }
    .overview-grid .video-panel, .overview-grid .trend-panel, .overview-grid .diagnosis-panel { grid-column: 1; }
    .overview-grid .diagnosis-panel { grid-row: auto; }
  }

  .video-preview-916 {
    position: relative; width: 100%; max-width: 220px; aspect-ratio: 9 / 16;
    border-radius: 12px; overflow: hidden; margin: 0 auto 8px; cursor: pointer; background: var(--card-2);
  }
  .video-preview-916 img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .play-badge {
    width: 52px; height: 52px; border-radius: 50%; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
  }
  .preview-play-msg { text-align: center; margin: 0 0 16px; min-height: 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  .panel-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .period-toggle { display: flex; gap: 4px; background: var(--card-2); border-radius: 8px; padding: 3px; }
  .period-toggle button {
    background: transparent; color: var(--ink-soft); padding: 5px 14px; font-size: 12px; border-radius: 6px;
  }
  .period-toggle button.active { background: var(--accent); color: #fff; }
  .trend-chart { width: 100%; height: 220px; }

  .platform-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  #platformStatRow { margin-bottom: 16px; }
  .tab-chip {
    padding: 7px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); background: var(--card-2); cursor: pointer;
  }
  .tab-chip.active { color: #fff; background: var(--accent); }

  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .grid-thumb {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 3 / 4; background: var(--card-2);
  }
  .grid-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid-thumb .grid-overlay {
    position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 600; color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  }

  .diagnosis-meta { font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; }
  .diagnosis-block { display: flex; gap: 10px; margin-bottom: 16px; }
  .diagnosis-tag {
    flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px; height: fit-content;
  }
  .diagnosis-tag.risk { background: var(--danger-soft); color: var(--danger); }
  .diagnosis-tag.opportunity { background: var(--success-soft); color: var(--success); }
  .diagnosis-tag.info { background: var(--accent-soft); color: var(--accent); }
  .diagnosis-text { font-size: 13px; line-height: 1.7; color: var(--ink); }
  .diagnosis-back {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent);
    cursor: pointer; margin-bottom: 14px; background: none; padding: 0; font-weight: 600;
  }
  .video-stats-row { display: flex; gap: 16px; margin: 10px 0 16px; }
  .video-stats-row span { font-size: 12px; color: var(--ink-soft); }

  .video-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .video-thumb-item { flex-shrink: 0; width: 140px; cursor: pointer; }
  .video-thumb-item img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 10px;
    border: 2px solid transparent; display: block;
  }
  .video-thumb-item.active img { border-color: var(--accent); }
  .video-thumb-item .thumb-title {
    display: block; font-size: 11px; color: var(--ink-soft); margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .video-thumb-item.active .thumb-title { color: var(--accent); }

  /* ---------- Generic list / form panels (banners, users, accounts) ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .users-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) {
    .users-columns { grid-template-columns: 1fr; }
  }
  .add-account-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  @media (max-width: 1100px) {
    .add-account-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .add-account-grid { grid-template-columns: 1fr; }
  }
  .activity-row { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .activity-row:last-child { border-bottom: none; }
  .activity-time { color: var(--ink-faint); font-size: 12px; white-space: nowrap; flex-shrink: 0; width: 70px; }
  .activity-user { font-weight: 600; flex-shrink: 0; }
  .activity-action { color: var(--ink-soft); flex-shrink: 0; }
  .activity-detail { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { margin-top: 16px; display: flex; gap: 10px; }
  .row-item { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row-item:last-child { border-bottom: none; }
  .row-item img { width: 120px; height: 48px; object-fit: cover; border-radius: 8px; background: var(--card-2); flex-shrink: 0; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns button { padding: 6px 12px; font-size: 12px; }

  #productList .row-item { align-items: stretch; }
  #productList .row-body { display: flex; flex-direction: column; }
  .row-label-bold { font-weight: 700; }
  .row-code-inline { font-size: 12px; font-weight: 400; color: var(--ink-soft); margin-left: 5ch; }
  .row-gap-5 { margin-left: 5ch; }
  .copy-icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    margin-left: 4px; padding: 0; border: none; background: transparent; color: var(--ink-soft);
    cursor: pointer; font-size: 12px; vertical-align: middle;
  }
  .copy-icon-btn:hover { color: var(--accent); }
  .row-notes-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 8px; }
  .row-notes-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--ink-soft); }
  .row-notes-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .row-notes-actions .icon-btn { width: 34px; height: 34px; font-size: 16px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .row-item img.avatar-img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--card-2); }
  .badge-dark { background: #05070c; color: #fff; }
  .badge-green { background: var(--success-soft); color: var(--success); }
  .badge-pink { background: var(--danger-soft); color: var(--danger); }
  .badge-blue { background: var(--accent-soft); color: var(--accent); }
  .badge-gray { background: var(--card-2); color: var(--ink-soft); }

  .mini-tag {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px; font-size: 10px; font-weight: 700; margin-right: 3px;
  }

  .identity-bind-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .mini-tag-remove {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent); padding: 3px 6px 3px 10px; border-radius: 999px;
  }
  .mini-tag-remove span { cursor: pointer; color: var(--ink-faint); font-size: 11px; }
  .mini-tag-remove span:hover { color: var(--danger); }
  .bind-select {
    font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px dashed var(--line);
    background: transparent; color: var(--ink-soft); width: auto;
  }

  .identity-card {

<script>
const API_BASE = '/admin/api/admin';
const PUBLIC_API_BASE = '/admin/api';
let currentUser = null;
let allIdentities = [];
let currentAccountId = 'all';
let overviewCache = {};
let activeSection = 'overview';
let trendPeriod = 7;

const NAV_ANALYTICS = [
  { key: 'overview', label: '经营分析总览' },
];
const NAV_WORK = [
  {
    key: 'accounts', label: '矩阵账号管理',
    children: [
      { key: 'accounts-list', label: '账号列表' },
      { key: 'accounts-add', label: '添加账号', roles: ['super_admin'] },
    ],
  },
  { key: 'create', label: 'AI创作台' },
  { key: 'benchmark', label: 'AI素材库', stub: true },
  { key: 'service', label: 'AI机器人', stub: true },
  {
    key: 'orders', label: '订单跟踪', sublabel: '跟单猿',
    children: [
      { key: 'orders-products', label: '商品信息' },
      { key: 'orders-orders', label: '订单信息' },
    ],
  },
];
const NAV_ACCOUNTS = [
  {
    key: 'users', label: '账号权限管理', roles: ['super_admin'],
    children: [
      { key: 'users-internal', label: '内部账号管理' },
      { key: 'users-external', label: '外部账号管理' },
    ],
  },
  {
    key: 'saleslog', label: '销售日志记录',
    children: [
      { key: 'saleslog-diary', label: '跟单猿日志' },
      { key: 'saleslog-performance', label: '跟单猿业绩' },
    ],
  },
];
const NAV_SYSTEM = [
  { key: 'banners', label: '首页轮播广告' },
  {
    key: 'tutorials', label: '使用教程管理',
    children: [
      { key: 'tutorials-add', label: '教程添加' },
    ],
  },
];
let expandedNavGroups = new Set();

function token() { return localStorage.getItem('rv_admin_token') || ''; }
function setToken(t) { t ? localStorage.setItem('rv_admin_token', t) : localStorage.removeItem('rv_admin_token'); }

async function api(path, options = {}, base = API_BASE) {
  const res = await fetch(`${base}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${token()}` },
  });
  if (res.status === 401) {
    setToken(null);
    showLogin('登录已过期，请重新登录');
    throw new Error('unauthorized');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : null;
}

function publicApi(path, options = {}) {
  return api(path, options, PUBLIC_API_BASE);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtNum(n) {
  if (n === undefined || n === null) return '0';
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + '万';
  return Math.round(n).toLocaleString('zh-CN');
}
function platformInitial(p) { return { douyin: '抖', video_channel: '视', xiaohongshu: '红' }[p] || '·'; }
function platformBadge(p) { return { douyin: 'badge-dark', video_channel: 'badge-green', xiaohongshu: 'badge-pink' }[p] || 'badge-blue'; }
function platformLabel(p) { return { douyin: '抖音', video_channel: '视频号', xiaohongshu: '小红书' }[p] || p; }

function showLogin(msg) {
  document.getElementById('loginView').hidden = false;
  document.getElementById('appShell').hidden = true;
  if (msg) {
    document.getElementById('loginMsg').textContent = msg;
    document.getElementById('loginMsg').className = 'msg error';
  }
}

async function login() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; msg.className = 'msg error'; return; }
  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || '登录失败'); }
    const data = await res.json();
    setToken(data.token);
    currentUser = data.user;
    await enterApp();

function findNavItem(key) {
  const all = [...NAV_ANALYTICS, ...NAV_WORK, ...NAV_ACCOUNTS, ...NAV_SYSTEM];
  for (const item of all) {
    if (item.key === key) return item;
    if (item.children) {
      const child = item.children.find((c) => c.key === key);
      if (child) return child;
    }
  }
  return null;
}

async function fetchOverview(accountId, period) {
  const key = `${accountId}:${period}`;
  if (overviewCache[key]) return overviewCache[key];
  const res = await fetch(
    `${PUBLIC_API_BASE}/dashboard/overview?account_id=${encodeURIComponent(accountId)}&period=${period}`,
    { headers: { Authorization: `Bearer ${token()}` } },
  );
  if (res.status === 401) { setToken(null); showLogin('登录已过期，请重新登录'); throw new Error('unauthorized'); }
  if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || res.statusText); }
  const data = await res.json();
  overviewCache[key] = data;
  return data;
}

function sparklinePath(series, w, h) {
  if (!series || series.length < 2) return '';
  const min = Math.min(...series);
  const max = Math.max(...series);
  const range = max - min || 1;
  const stepX = w / (series.length - 1);
  return series.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * stepX).toFixed(1)},${(h - ((v - min) / range) * h).toFixed(1)}`).join(' ');
}

function deltaBadge(m) {
  const up = m.change_pct >= 0;
  return `<span class="kpi-delta ${up ? 'up' : 'down'}">${up ? '↗' : '↘'} ${Math.abs(m.change_pct)}%</span>`;
}

function renderKpiGrid(todayMetrics) {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = KPI_DEFS.map((def) => {
    if (def.combined) {
      return `
        <div class="kpi-card">
          <span class="kpi-label">${def.label}</span>
          <div class="kpi-combined">
            ${def.parts.map((p) => {
              const m = todayMetrics[p.key];
              return `
                <div class="kpi-combined-item">
                  <span class="kpi-combined-label">${p.label}</span>
                  <span class="kpi-combined-val">${fmtNum(m.value)}</span>
                  ${deltaBadge(m)}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
    const m = todayMetrics[def.key];
    const up = m.change_pct >= 0;
    const color = up ? '#34d399' : '#f472b6';
    const path = sparklinePath(m.series, 200, 36);
    return `
      <div class="kpi-card">
        <span class="kpi-label">${def.label}</span>
        <span class="kpi-value">${def.fmt(m.value)}</span>
        ${deltaBadge(m)}
        <svg class="kpi-spark" viewBox="0 0 200 36" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
        </svg>
      </div>
    `;
  }).join('');
}

function renderTrendChart(trend) {
  const svg = document.getElementById('trendChart');
  if (!svg) return;
  const W = 640, H = 220, padL = 56, padR = 16, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const all = [...trend.plays, ...trend.new_followers];
  const max = Math.max(...all, 1);
  const min = 0;
  const n = trend.dates.length;
  const stepX = n > 1 ? plotW / (n - 1) : 0;
  const scaleY = (v) => padT + plotH - ((v - min) / (max - min || 1)) * plotH;
  const scaleX = (i) => padL + i * stepX;

  const line = (series) => series.map((v, i) => `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(1)},${scaleY(v).toFixed(1)}`).join(' ');

  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + plotH * (1 - f);
    const val = Math.round(max * f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2a3040" stroke-width="1"/>
            <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#5b6377">${fmtNum(val)}</text>`;
  }).join('');

  const xLabels = trend.dates.map((d, i) => {
    if (n > 10 && i % Math.ceil(n / 6) !== 0) return '';
    return `<text x="${scaleX(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5b6377">${d}</text>`;
  }).join('');

  const lastPlays = trend.plays[trend.plays.length - 1];
  const lastFollowers = trend.new_followers[trend.new_followers.length - 1];

  svg.innerHTML = `
    ${gridLines}
    ${xLabels}
    <path d="${line(trend.plays)}" fill="none" stroke="#4f7dfa" stroke-width="2.5"/>
    <path d="${line(trend.new_followers)}" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="${scaleX(n - 1)}" cy="${scaleY(lastPlays)}" r="4" fill="#4f7dfa"/>
    <circle cx="${scaleX(n - 1)}" cy="${scaleY(lastFollowers)}" r="4" fill="#f59e0b"/>
    <text x="${scaleX(n - 1) - 8}" y="${scaleY(lastPlays) - 10}" text-anchor="end" font-size="11" fill="#4f7dfa" font-weight="700">${fmtNum(lastPlays)}</text>
    <text x="${scaleX(n - 1) - 8}" y="${scaleY(lastFollowers) - 10}" text-anchor="end" font-size="11" fill="#f59e0b" font-weight="700">${fmtNum(lastFollowers)}</text>
  `;
}

  } else if (d === null) {
    display.innerHTML = `${escapeHtml(url)}<br><span style="color:var(--danger);font-size:12px;">自动抓取失败，链接已保存，数据需要之后手动补</span>`;
  } else {
    display.textContent = url;
  }
}

function toggleLinkLock(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const display = document.getElementById(inputId + 'Display');
  const platform = platformKeyFromInputId(inputId);

  if (input.disabled) {
    input.disabled = false;
    input.hidden = false;
    display.hidden = true;
    btn.textContent = '确定添加';
    btn.classList.remove('locked-btn');
    return;
  }

  if (!input.value.trim()) { alert('您还没有输入网址'); return; }
  const url = input.value.trim();

  // No scraping here — saving the link is instant. The backend scrapes
  // nickname/头像/粉丝/作品数/最近作品预览 by itself in the background right
  // after the account is created/updated (see accounts.py _auto_scrape_account),
  // so this form never blocks on a ~20s scrape. Refresh the identity detail
  // page a bit later to see the scraped data land.
  input.disabled = true;
  input.hidden = true;
  renderLockedDisplay(display, url, platform);
  display.hidden = false;
  btn.textContent = '修改编辑';
  btn.classList.add('locked-btn');
}

function accountFieldsFor(platform, existingAcc) {
  const d = scrapedData[platform];
  const posts = scrapedVideoList[platform];
  return {
    nickname: (d && d.nickname) || (existingAcc ? existingAcc.nickname : '') || '',
    avatar_url: (d && d.avatar_url) || (existingAcc ? existingAcc.avatar_url : null) || null,
    follower_count: d && d.follower_count != null ? d.follower_count : existingAcc ? existingAcc.follower_count : 0,
    video_count: d && d.video_count != null ? d.video_count : existingAcc ? existingAcc.video_count : 0,
    recent_posts: posts && posts.length ? posts : (existingAcc ? existingAcc.recent_posts || [] : []),
  };
}

async function submitNewIdentity() {
  const msg = document.getElementById('newIdentityMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';

  const name = document.getElementById('newIdentityName').value.trim();
  const operatorUserId = document.getElementById('newIdentityOperator').value || null;
  if (!name) {
    msg.textContent = '请填写矩阵号名称';
    msg.className = 'msg error';
    return;
  }

  const platformUrls = {};
  PLATFORM_DEFS.forEach((p) => {
    platformUrls[p.key] = document.getElementById(`newAcc_${p.key}_url`).value.trim() || null;
  });

  try {
    if (editingIdentityId) {
      const id = editingIdentityId;
      const identity = await publicApi(`/identities/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });

      if (operatorUserId !== editingOperatorOriginalId) {
        try {
          if (editingOperatorOriginalId) {
            await publicApi(`/users/${editingOperatorOriginalId}/identities/${id}`, { method: 'DELETE' });
          }
          if (operatorUserId) {
            await publicApi(`/users/${operatorUserId}/identities`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identity_id: id }),
            });
          }
        } catch (e) {
          msg.textContent = '基本信息和链接已保存，但销售跟单猿账号关联需要超级管理员权限，没有改成';
          msg.className = 'msg error';
        }
      }

      for (const p of PLATFORM_DEFS) {
        const url = platformUrls[p.key];
        const existingAcc = identity.accounts.find((a) => a.platform === p.key);
        if (url) {
          const fields = accountFieldsFor(p.key, existingAcc);
          if (existingAcc) {
            await publicApi(`/accounts/${existingAcc.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...fields, profile_url: url }),
            });
          } else {
            await publicApi('/accounts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identity_id: id, platform: p.key, profile_url: url, ...fields }),
            });
          }
        } else if (existingAcc && existingAcc.profile_url) {
          // Only remove the account if it previously had a link that's now being
          // cleared. An existing account with no profile_url (legacy data, never
          // touched by this form) is left alone — an empty field here must never
          // silently delete real follower/video data.
          await publicApi(`/accounts/${existingAcc.id}`, { method: 'DELETE' });
        }
      }

      allIdentities = await fetch(`${PUBLIC_API_BASE}/identities`).then((r) => r.json());
      editingIdentityId = null;
      const hadError = msg.className.includes('error');
      if (!hadError) { msg.textContent = '已保存'; msg.className = 'msg ok'; }
      setTimeout(() => {
        if (hadError) return;
        closePasscodeModal();
        if (accountsDetailId) { renderIdentityDetail(id); } else { renderIdentityList(); }
      }, hadError ? 0 : 800);
    } else {
      const identity = await publicApi('/identities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, operator_user_id: operatorUserId }),
      });
      for (const p of PLATFORM_DEFS) {
        if (!platformUrls[p.key]) continue;
        const fields = accountFieldsFor(p.key, null);
        await publicApi('/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity_id: identity.id, platform: p.key, profile_url: platformUrls[p.key], ...fields }),
        });
      }
      allIdentities = await fetch(`${PUBLIC_API_BASE}/identities`).then((r) => r.json());
      msg.textContent = '添加成功';
      msg.className = 'msg ok';
      setTimeout(() => showSection('accounts-list'), 600);
    }
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

function renderBannerList() {
  const list = document.getElementById('bannerList');
  if (!banners.length) { list.innerHTML = '<div class="empty-hint">暂无轮播图</div>'; return; }
  list.innerHTML = banners.slice().sort((a, b) => a.sort_order - b.sort_order).map((b) => `
    <div class="row-item">
      <img src="${staticUrl(b.image_url)}" alt="">
      <div class="row-body">
        <div class="row-title">${escapeHtml(b.title)}</div>

        <button class="danger" onclick="deleteBanner('${b.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function previewBannerImage() {
  const file = document.getElementById('fImage').files[0];
  const preview = document.getElementById('fImagePreview');
  if (!file) { preview.hidden = true; preview.src = ''; return; }
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
}

function editBanner(id) {
  const b = banners.find((x) => x.id === id);
  if (!b) return;
  editingBannerId = id;
  document.getElementById('bannerFormTitle').textContent = '编辑轮播图';
  document.getElementById('fTitle').value = b.title;
  document.getElementById('fSubtitle').value = b.subtitle || '';
  document.getElementById('fSort').value = b.sort_order;
  document.getElementById('fLink').value = b.link_url || '';
  document.getElementById('fImageUrl').value = b.image_url;
  document.getElementById('fImage').value = '';
  const preview = document.getElementById('fImagePreview');
  preview.src = staticUrl(b.image_url);
  preview.hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetBannerForm() {
  editingBannerId = null;
  document.getElementById('bannerFormTitle').textContent = '新增轮播图';
  ['fTitle', 'fSubtitle', 'fLink', 'fImageUrl'].forEach((id) => { document.getElementById(id).value = ''; });
  document.getElementById('fSort').value = '0';
  document.getElementById('fImage').value = '';
  document.getElementById('fImagePreview').hidden = true;
  document.getElementById('fImagePreview').src = '';
  document.getElementById('bannerFormMsg').textContent = '';
}

async function deleteBanner(id) {
  if (!confirm('确定删除这条轮播图吗？')) return;
  await api(`/banners/${id}`, { method: 'DELETE' });
  await loadBanners();
  renderBannerList();
}

async function submitBanner() {
  const msg = document.getElementById('bannerFormMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';
  try {
    let imageUrl = document.getElementById('fImageUrl').value;
    const file = document.getElementById('fImage').files[0];
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      const uploadRes = await api('/upload', { method: 'POST', body: fd });
      imageUrl = uploadRes.url;
    }
    if (!imageUrl) { msg.textContent = '请上传图片'; msg.className = 'msg error'; return; }
    const payload = {
      title: document.getElementById('fTitle').value.trim(),
      subtitle: document.getElementById('fSubtitle').value.trim(),
      image_url: imageUrl,
      link_url: document.getElementById('fLink').value.trim() || null,
      sort_order: Number(document.getElementById('fSort').value) || 0,
    };
    if (!payload.title) { msg.textContent = '请填写标题'; msg.className = 'msg error'; return; }
    if (editingBannerId) {
      await api(`/banners/${editingBannerId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      await api('/banners', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    msg.textContent = '已保存';
    msg.className = 'msg ok';
    resetBannerForm();
    await loadBanners();
    renderBannerList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

let tutorialQuill = null;

function initTutorialEditor() {
  tutorialQuill = new Quill('#tContentEditor', {
    theme: 'snow',
    placeholder: '教程正文，支持标题/加粗/列表/链接/图片',
    modules: {
      toolbar: {
        container: [
          [{ header: [2, 3, false] }],
          ['bold', 'italic', 'underline'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'image'],
          ['clean'],
        ],
        handlers: { image: quillImageHandler },
      },
    },
  });
}

function quillImageHandler() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const range = tutorialQuill.getSelection(true);
    const msg = document.getElementById('tutorialFormMsg');
    msg.className = 'msg';
    msg.textContent = '图片上传中...';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await api('/upload', { method: 'POST', body: fd });
      tutorialQuill.insertEmbed(range.index, 'image', res.url, 'user');
      tutorialQuill.setSelection(range.index + 1);
      msg.textContent = '';
    } catch (e) {
      msg.textContent = '图片上传失败：' + e.message;
      msg.className = 'msg error';
    }
  };
  input.click();
}

function renderTutorialList() {
  const list = document.getElementById('tutorialList');
  if (!tutorials.length) { list.innerHTML = '<div class="empty-hint">还没有教程文章</div>'; return; }
  list.innerHTML = tutorials.map((t) => `
    <div class="tutorial-list-item">
      <span class="tag">${TUTORIAL_PLATFORM_LABELS[t.platform] || t.platform}</span>
      <div class="row-body">
        <div class="row-title">${escapeHtml(t.title)}</div>
        <div class="row-sub">排序 ${t.sort_order}</div>
      </div>
      <div class="row-btns">
        <button class="ghost" onclick="editTutorial('${t.id}')">编辑</button>
        <button class="danger" onclick="deleteTutorial('${t.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function editTutorial(id) {
  const t = tutorials.find((x) => x.id === id);
  if (!t) return;
  editingTutorialId = id;
  document.getElementById('tutorialFormTitle').textContent = '编辑教程';
  document.getElementById('tPlatform').value = t.platform;
  document.getElementById('tSort').value = t.sort_order;
  document.getElementById('tTitle').value = t.title;
  document.getElementById('tCoverImageUrl').value = t.cover_image_url || '';
  tutorialQuill.root.innerHTML = t.content || '';
  window.scrollTo({ top: document.getElementById('tutorialFormTitle').offsetTop, behavior: 'smooth' });
}

function resetTutorialForm() {
  editingTutorialId = null;
  document.getElementById('tutorialFormTitle').textContent = '新增教程';
  document.getElementById('tPlatform').value = 'general';
  document.getElementById('tSort').value = '0';
  document.getElementById('tTitle').value = '';
  document.getElementById('tCoverImageUrl').value = '';
  document.getElementById('tCoverImage').value = '';
  if (tutorialQuill) tutorialQuill.root.innerHTML = '';
  document.getElementById('tutorialFormMsg').textContent = '';
}

async function deleteTutorial(id) {
  if (!confirm('确定删除这篇教程吗？')) return;
  await api(`/tutorials/${id}`, { method: 'DELETE' });
  await loadTutorials();
  renderTutorialList();
}

async function submitTutorial() {
  const msg = document.getElementById('tutorialFormMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';
  try {
    let coverImageUrl = document.getElementById('tCoverImageUrl').value || null;
    const coverFile = document.getElementById('tCoverImage').files[0];
    if (coverFile) {
      const fd = new FormData();
      fd.append('file', coverFile);
      const uploadRes = await api('/upload', { method: 'POST', body: fd });
      coverImageUrl = uploadRes.url;
    }
    const payload = {
      platform: document.getElementById('tPlatform').value,
      title: document.getElementById('tTitle').value.trim(),
      cover_image_url: coverImageUrl,
      content: tutorialQuill.root.innerHTML,
      sort_order: Number(document.getElementById('tSort').value) || 0,
    };
    if (!payload.title) { msg.textContent = '请填写标题'; msg.className = 'msg error'; return; }
    if (!tutorialQuill.getText().trim()) { msg.textContent = '请填写正文内容'; msg.className = 'msg error'; return; }
    if (editingTutorialId) {
      await api(`/tutorials/${editingTutorialId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      await api('/tutorials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    msg.textContent = '已保存';
    msg.className = 'msg ok';
    resetTutorialForm();
    await loadTutorials();
    renderTutorialList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

const AVATAR_CROP = { vw: 240, vh: 240, outW: 480, outH: 480, maxBytesKB: 100 };
let avatarEntry = null; // { url?, file?, originalFile?, previewUrl? } | null, edited-user modal's single avatar slot

function renderAvatarThumb() {
  const wrap = document.getElementById('euAvatarThumbRow');
  if (!wrap) return;
  if (!avatarEntry) {
    wrap.innerHTML = `<label class="img-thumb-add" for="euAvatarFileInput">＋<br>头像</label>`;
    return;
  }
  const src = avatarEntry.previewUrl || staticUrl(avatarEntry.url);
  wrap.innerHTML = `
    <div class="img-thumb-item">
      <img src="${src}" class="img-thumb-9x16" alt="">
      ${avatarEntry.file ? '<span class="img-thumb-pending">待保存</span>' : ''}
      <div class="img-thumb-actions">
        <button type="button" class="img-thumb-btn" onclick="editAvatarThumb()">编辑</button>
        <button type="button" class="img-thumb-btn danger" onclick="clearAvatarThumb()">删除</button>
      </div>
    </div>
  `;
}

async function handleAvatarFileSelect(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file || !file.type.startsWith('image/')) return;
  try {
    const img = await loadImageFromFile(file);
    const state = computeCoverCrop(img.naturalWidth, img.naturalHeight, AVATAR_CROP.vw, AVATAR_CROP.vh);
    const blob = await cropImageElementToBlob(img, state, AVATAR_CROP.outW, AVATAR_CROP.outH, AVATAR_CROP.maxBytesKB * 1024);
    URL.revokeObjectURL(img.src);
    if (!blob) return;
    avatarEntry = {
      file: new File([blob], 'avatar-' + Date.now() + '.jpg', { type: 'image/jpeg' }),
      originalFile: file,
      previewUrl: URL.createObjectURL(blob),
      url: null,
    };
    renderAvatarThumb();
  } catch (e) { /* skip unreadable file */ }
}

function clearAvatarThumb() {
  avatarEntry = null;
  renderAvatarThumb();
}

async function editAvatarThumb() {
  if (!avatarEntry) return;
  let sourceFile = avatarEntry.originalFile || avatarEntry.file;
  if (!sourceFile && avatarEntry.url) {
    try {
      const resp = await fetch(staticUrl(avatarEntry.url));
      const blob = await resp.blob();
      sourceFile = new File([blob], 'original.jpg', { type: blob.type || 'image/jpeg' });
    } catch (e) {
      alert('无法加载原图，请重新上传');
      return;
    }
  }
  if (!sourceFile) return;
  openImageCropper(sourceFile, '裁剪头像（1:1）', (blob) => {
    avatarEntry = {
      file: new File([blob], 'avatar-' + Date.now() + '.jpg', { type: 'image/jpeg' }),
      originalFile: sourceFile,
      previewUrl: URL.createObjectURL(blob),
      url: null,
    };
    renderAvatarThumb();
  }, AVATAR_CROP.vw, AVATAR_CROP.vh, AVATAR_CROP.outW, AVATAR_CROP.outH, AVATAR_CROP.maxBytesKB);
}

async function submitEditUser(userId) {
  const msg = document.getElementById('editUserMsg');
  const payload = { username: document.getElementById('euUsername').value.trim() };
  const password = document.getElementById('euPassword').value;
  if (password) payload.password = password;
  const passcodeEl = document.getElementById('euPasscode');
  if (passcodeEl && passcodeEl.value) payload.passcode = passcodeEl.value;
  if (!payload.username) { msg.textContent = '请填写用户名'; msg.className = 'msg error'; return; }
  msg.textContent = '保存中...';
  msg.className = 'msg';
  try {
    if (avatarEntry && avatarEntry.file) {
      const fd = new FormData();
      fd.append('file', avatarEntry.file);
      const res = await api('/upload', { method: 'POST', body: fd });
      payload.avatar_url = res.url;
    } else if (!avatarEntry) {
      const original = users.find((x) => x.id === userId);
      if (original && original.avatar_url) payload.avatar_url = '';
    }
    await api(`/users/${userId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    closePasscodeModal();
    await loadUsers();
    renderUserList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

async function submitUser() {
  const msg = document.getElementById('userFormMsg');

  const payload = {
    username: document.getElementById('uUsername').value.trim(),

      fd.append('file', avatarEntry.file);

    }
    let createdCategory = null;
    if (editingCategoryId) {
      await api(`/products/categories/${editingCategoryId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      createdCategory = await api('/products/categories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    (window[closeFnName || 'closeProductModal'])();
    productCategories = await api('/products/categories');
    renderCategoryBar();
    renderProductList();
    // 如果"新增/编辑商品"表单还开着（走的是 openAddCategoryModalInline 这条
    // 路），顺手把它的分类选框也刷新，新建的直接自动选中。
    const pCategorySelect = document.getElementById('pCategory');
    if (pCategorySelect) {
      pCategorySelect.innerHTML = `<option value="">未分类</option>${productCategories.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}`;
      if (createdCategory) pCategorySelect.value = createdCategory.id;
    }
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

async function deleteCategory(id) {
  if (!confirm('确定删除这个分类吗？已使用该分类的商品不会被删除，但会显示为未分类。')) return;
  try {
    await api(`/products/categories/${id}`, { method: 'DELETE' });

    if (productCategoryFilter === id) productCategoryFilter = 'all';
    renderCategoryBar();
    renderProductList();
  } catch (e) {
    alert('删除失败：' + e.message);
  }
}

// 拖动只在鼠标真正按下拖拽那一刻才把弹窗切成 position:fixed（用当前的
// 屏幕坐标接管，不会跳一下）；弹窗每次重新 innerHTML 渲染都是全新节点，
// 上次拖到哪不会带过来，下次打开还是居中的。
function makeModalDraggable(cardSelector, handleSelector) {
  const card = document.querySelector(cardSelector);
  const handle = document.querySelector(handleSelector) || card;
  if (!card || !handle) return;
  let dragging = false;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;
  function onMouseMove(e) {
    if (!dragging) return;
    card.style.left = (startLeft + (e.clientX - startX)) + 'px';
    card.style.top = (startTop + (e.clientY - startY)) + 'px';
  }
  function onMouseUp() {
    dragging = false;
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  }
  handle.style.cursor = 'move';
  handle.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const rect = card.getBoundingClientRect();
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startLeft = rect.left; startTop = rect.top;
    card.style.position = 'fixed';
    card.style.left = startLeft + 'px';
    card.style.top = startTop + 'px';
    card.style.margin = '0';
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
    e.preventDefault();
  });
}

function isImageUrl(url) {
  return /\.(png|jpe?g|gif|svg|webp)$/i.test(url || '');
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function computeCoverCrop(nw, nh, vw = CROP_VW, vh = CROP_VH) {
  const minScale = Math.max(vw / nw, vh / nh);
  return {
    naturalW: nw, naturalH: nh, scale: minScale, minScale, maxScale: minScale * 3,
    left: (vw - nw * minScale) / 2,
    top: (vh - nh * minScale) / 2,
    vw, vh,
  };
}

async function cropImageElementToBlob(imgEl, state, outW = 720, outH = 1280, maxBytes = 200 * 1024) {
  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  const sx = -state.left / state.scale;
  const sy = -state.top / state.scale;
  const sw = (state.vw || CROP_VW) / state.scale;
  const sh = (state.vh || CROP_VH) / state.scale;
  ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, outW, outH);

  let quality = 0.9;
  let blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
  while (blob && blob.size > maxBytes && quality > 0.3) {
    quality -= 0.1;
    blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
  }
  return blob;
}

function renderAttachmentThumbs(kind) {
  const cfg = ATTACHMENT_CONFIG[kind];
  const wrap = document.getElementById(cfg.listId);
  if (!wrap) return;
  const list = attachmentsState[kind];
  const addTile = list.length < cfg.max
    ? `<label class="img-thumb-add" for="${cfg.addInputId}">＋<br>添加</label>`
    : '';
  wrap.innerHTML = list.map((entry, idx) => {
    const progressHtml = `
      <div class="img-progress" id="att-${kind}-progress-${idx}" hidden>
        <div class="img-progress-track"><div class="img-progress-bar" id="att-${kind}-progressbar-${idx}"></div></div>
        <span class="img-progress-text" id="att-${kind}-progresstext-${idx}">0%</span>
      </div>
    `;
    if (entry.isImage) {
      const src = entry.previewUrl || staticUrl(entry.url);
      return `
        <div class="img-thumb-item">
          <img src="${src}" class="img-thumb-9x16" alt="">
          ${entry.file ? '<span class="img-thumb-pending">待保存</span>' : ''}
          <div class="img-thumb-hover-preview"><img src="${src}" alt=""></div>
          <div class="img-thumb-actions">
            <button type="button" class="img-thumb-btn" onclick="editAttachmentAt('${kind}',${idx})">编辑</button>
            <button type="button" class="img-thumb-btn danger" onclick="removeAttachmentAt('${kind}',${idx})">删除</button>
          </div>
          ${progressHtml}
        </div>
      `;
    }
    const fileName = entry.file ? entry.file.name : (entry.url || '').split('/').pop();
    const nameHtml = entry.url
      ? `<a href="${staticUrl(entry.url)}" target="_blank" rel="noopener" class="img-thumb-doc-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</a>`
      : `<div class="img-thumb-doc-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</div>`;
    return `
      <div class="img-thumb-item img-thumb-doc">
        <div class="img-thumb-doc-icon">📄</div>
        ${nameHtml}
        ${entry.file ? '<span class="img-thumb-pending">待保存</span>' : ''}
        <div class="img-thumb-actions">
          <button type="button" class="img-thumb-btn danger" onclick="removeAttachmentAt('${kind}',${idx})">删除</button>
        </div>
        ${progressHtml}
      </div>
    `;
  }).join('') + addTile;
}

async function handleAttachmentsSelect(event, kind) {
  const cfg = ATTACHMENT_CONFIG[kind];
  const list = attachmentsState[kind];
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  for (const file of files) {
    if (list.length >= cfg.max) { alert(cfg.alertLabel + '最多 ' + cfg.max + ' 个'); break; }
    const isImage = file.type.startsWith('image/');
    if (isImage) {
      try {
        const img = await loadImageFromFile(file);
        const state = computeCoverCrop(img.naturalWidth, img.naturalHeight);
        const blob = await cropImageElementToBlob(img, state);
        URL.revokeObjectURL(img.src);
        if (!blob) continue;
        const croppedFile = new File([blob], 'crop-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.jpg', { type: 'image/jpeg' });
        list.push({ file: croppedFile, originalFile: file, previewUrl: URL.createObjectURL(blob), url: null, isImage: true });
      } catch (e) { /* skip unreadable file */ }
    } else if (cfg.allowDocs) {
      list.push({ file, originalFile: null, previewUrl: null, url: null, isImage: false });
    }
  }
  renderAttachmentThumbs(kind);
}

function removeAttachmentAt(kind, idx) {
  attachmentsState[kind].splice(idx, 1);
  renderAttachmentThumbs(kind);
}

async function editAttachmentAt(kind, idx) {
  const entry = attachmentsState[kind][idx];
  if (!entry || !entry.isImage) return;
  let sourceFile = entry.originalFile || entry.file;
  if (!sourceFile && entry.url) {
    try {
      const resp = await fetch(staticUrl(entry.url));
      const blob = await resp.blob();
      sourceFile = new File([blob], 'original.jpg', { type: blob.type || 'image/jpeg' });
    } catch (e) {
      alert('无法加载原图，请重新上传');
      return;
    }
  }
  if (!sourceFile) return;
  openImageCropper(sourceFile, ATTACHMENT_CONFIG[kind].cropTitle, (blob) => {
    attachmentsState[kind][idx] = {
      file: new File([blob], 'crop-' + Date.now() + '.jpg', { type: 'image/jpeg' }),
      originalFile: sourceFile,
      previewUrl: URL.createObjectURL(blob),
      url: null,
      isImage: true,
    };
    renderAttachmentThumbs(kind);
  });
}

function openImageCropper(file, title, onConfirm, vw = CROP_VW, vh = CROP_VH, outW = 720, outH = 1280, maxBytesKB = 200) {
  cropConfirmCallback = onConfirm;
  cropOutputConfig = { outW, outH, maxBytes: maxBytesKB * 1024 };
  const reader = new FileReader();
  reader.onload = (e) => {
    const modal = document.getElementById('cropModal');
    modal.innerHTML = `
      <div class="modal-card wide" onclick="event.stopPropagation()">
        <h2>${title}</h2>
        <div class="crop-viewport" id="cropViewport" style="width:${vw}px;height:${vh}px;"><img id="cropImg" src="${e.target.result}" draggable="false"></div>
        <div class="crop-controls">
          <label class="row-sub">缩放</label>
          <input type="range" id="cropZoom" min="0" max="100" value="0">
        </div>
        <p class="row-sub">拖动图片调整位置，拉动滑块缩放；确定后会自动裁剪并压缩到约 ${maxBytesKB}KB，最后别忘了点页面上的"保存"</p>
        <div class="actions">
          <button onclick="confirmCrop()">确定裁剪</button>
          <button class="ghost" onclick="cancelCrop()">取消</button>
        </div>
        <p class="msg" id="cropMsg"></p>
      </div>
    `;
    modal.hidden = false;
    initCropper(vw, vh);
  };
  reader.readAsDataURL(file);
}

function initCropper(vw = CROP_VW, vh = CROP_VH) {
  const img = document.getElementById('cropImg');
  const zoomSlider = document.getElementById('cropZoom');

  const onImgLoad = () => {
    cropState = computeCoverCrop(img.naturalWidth, img.naturalHeight, vw, vh);
    applyCropTransform();
    zoomSlider.value = 0;
  };
  if (img.complete && img.naturalWidth) onImgLoad(); else img.onload = onImgLoad;

  let dragging = false;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;
  img.onpointerdown = (ev) => {
    if (!cropState) return;
    dragging = true;
    startX = ev.clientX; startY = ev.clientY;
    startLeft = cropState.left; startTop = cropState.top;
    img.setPointerCapture(ev.pointerId);
  };
  img.onpointermove = (ev) => {
    if (!dragging || !cropState) return;
    cropState.left = startLeft + (ev.clientX - startX);
    cropState.top = startTop + (ev.clientY - startY);
    clampCrop();
    applyCropTransform();
  };
  img.onpointerup = () => { dragging = false; };
  img.onpointercancel = () => { dragging = false; };

  zoomSlider.oninput = () => {
    if (!cropState) return;
    const t = zoomSlider.value / 100;
    const newScale = cropState.minScale + t * (cropState.maxScale - cropState.minScale);
    const cx = vw / 2, cy = vh / 2;
    const imgX = (cx - cropState.left) / cropState.scale;
    const imgY = (cy - cropState.top) / cropState.scale;
    cropState.scale = newScale;
    cropState.left = cx - imgX * newScale;
    cropState.top = cy - imgY * newScale;
    clampCrop();
    applyCropTransform();
  };
}

function clampCrop() {
  const vw = cropState.vw || CROP_VW;
  const vh = cropState.vh || CROP_VH;
  const w = cropState.naturalW * cropState.scale;
  const h = cropState.naturalH * cropState.scale;
  if (cropState.left > 0) cropState.left = 0;
  if (cropState.left + w < vw) cropState.left = vw - w;
  if (cropState.top > 0) cropState.top = 0;
  if (cropState.top + h < vh) cropState.top = vh - h;
}

function applyCropTransform() {
  const img = document.getElementById('cropImg');
  if (!img || !cropState) return;
  img.style.width = (cropState.naturalW * cropState.scale) + 'px';
  img.style.height = (cropState.naturalH * cropState.scale) + 'px';
  img.style.left = cropState.left + 'px';
  img.style.top = cropState.top + 'px';
}

async function confirmCrop() {
  if (!cropState) return;
  const msg = document.getElementById('cropMsg');
  msg.textContent = '处理中...';
  msg.className = 'msg';
  const img = document.getElementById('cropImg');
  const blob = await cropImageElementToBlob(img, cropState, cropOutputConfig.outW, cropOutputConfig.outH, cropOutputConfig.maxBytes);
  if (!blob) { msg.textContent = '裁剪失败，请重试'; msg.className = 'msg error'; return; }
  cropState = null;
  const cb = cropConfirmCallback;
  cropConfirmCallback = null;
  closeCropModal();
  if (cb) cb(blob);
}

function cancelCrop() {
  cropState = null;
  cropConfirmCallback = null;
  closeCropModal();
}

function closeCropModal() {
  const modal = document.getElementById('cropModal');
  modal.hidden = true;
  modal.innerHTML = '';
}

let productCarouselIndex = {}; // productId -> currently shown image index in 商品列表
let productSearchQuery = '';
let productSortOrder = 'desc'; // 'desc' = 最新优先, 'asc' = 最早优先

function setProductCarouselIndex(productId, idx) {
  productCarouselIndex[productId] = idx;
  renderProductList();
}

function onProductSearchInput() {
  productSearchQuery = document.getElementById('productSearch').value.trim().toLowerCase();
  renderProductList();
}

function onProductSortChange() {
  productSortOrder = document.getElementById('productSort').value;
  renderProductList();
}

function getFilteredSortedProducts() {
  let list = products.slice();
  if (productCategoryFilter !== 'all') {
    list = list.filter((p) => p.category_id === productCategoryFilter);
  }
  if (productSearchQuery) {
    list = list.filter((p) => {
      const haystack = [p.name, p.internal_code, p.chassis_info, p.chassis_number].join(' ').toLowerCase();
      return haystack.includes(productSearchQuery);
    });
  }
  list.sort((a, b) => {
    const ta = Date.parse(a.created_at) || 0;
    const tb = Date.parse(b.created_at) || 0;
    return productSortOrder === 'asc' ? ta - tb : tb - ta;
  });
  return list;
}

function renderProductList() {
  const list = document.getElementById('productList');
  if (!products.length) { list.innerHTML = '<div class="empty-hint">暂无商品</div>'; return; }
  const filteredProducts = getFilteredSortedProducts();
  if (!filteredProducts.length) { list.innerHTML = '<div class="empty-hint">没有匹配的商品</div>'; return; }
  list.innerHTML = filteredProducts.map((p) => {
    const images = p.main_image_urls || [];
    const curIdx = images.length ? Math.min(productCarouselIndex[p.id] || 0, images.length - 1) : 0;
    const thumbHtml = images.length ? `
      <div class="product-thumb-carousel">
        <img src="${staticUrl(images[curIdx])}" alt="">
        ${images.length > 1 ? `
          <div class="carousel-dots">
            ${images.map((_, i) => `<span class="carousel-dot ${i === curIdx ? 'active' : ''}" onclick="setProductCarouselIndex('${p.id}',${i})"></span>`).join('')}
          </div>
        ` : ''}
      </div>
    ` : `<div class="product-thumb-carousel product-thumb-empty">暂无主图</div>`;
    const chassisNumberJs = (p.chassis_number || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const category = p.category_id ? categoryById(p.category_id) : null;
    const categoryBadgeHtml = category ? `
      <span class="category-badge">${category.icon_url ? `<img src="${staticUrl(category.icon_url)}" alt="">` : ''}${escapeHtml(category.name)}</span>
    ` : '';
    const priceHtml = p.price ? `<span class="row-code-inline">¥${p.price.toLocaleString('zh-CN')}</span>` : '';
    return `
      <div class="row-item">
        ${thumbHtml}
        <div class="row-body">
          <div class="row-title">${escapeHtml(p.name)}${p.internal_code ? `<span class="row-code-inline">${escapeHtml(p.internal_code)}</span>` : ''}${priceHtml}${categoryBadgeHtml}</div>
          <div class="row-sub">${escapeHtml(p.chassis_info || '')}${p.chassis_number ? `<span class="row-gap-5">底盘号：${escapeHtml(p.chassis_number)}</span><button type="button" class="copy-icon-btn" onclick="copyChassisNumber(event,'${chassisNumberJs}')" title="复制底盘号">${COPY_ICON_SVG}</button>` : ''}</div>
          <div class="row-sub">${p.layout_urls && p.layout_urls.length ? `配置布局：${p.layout_urls.map((u, i) => `<a href="${staticUrl(u)}" target="_blank" rel="noopener">文件${i + 1}</a>`).join(' ')}` : ''}</div>
          <div class="row-sub">${p.standard_config ? `<span class="row-label-bold">标准配置：</span>${escapeHtml(p.standard_config)}` : ''}</div>
          <div class="row-notes-line">
            <span class="row-notes-text" title="${escapeHtml(p.optional_config || '')}">${p.optional_config ? `<span class="row-label-bold">增选配置：</span>${escapeHtml(p.optional_config)}` : ''}</span>
            <span class="row-notes-actions">
              <button type="button" class="icon-btn" onclick="editProduct('${p.id}')" title="编辑">✎</button>
              <button type="button" class="icon-btn danger" onclick="deleteProduct('${p.id}')" title="删除">🗑</button>
            </span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

const COPY_ICON_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
const DEFAULT_AVATAR_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>';
const CHECK_ICON_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

function copyChassisNumber(evt, text) {
  const btn = evt.currentTarget;
  const showCopied = () => {
    btn.innerHTML = CHECK_ICON_SVG;
    setTimeout(() => { btn.innerHTML = COPY_ICON_SVG; }, 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(showCopied).catch(() => { fallbackCopyText(text); showCopied(); });
  } else {
    fallbackCopyText(text);
    showCopied();
  }
}

function fallbackCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}

function editProduct(id) {
  const p = products.find((x) => x.id === id);
  if (!p) return;
  editingProductId = id;
  attachmentsState = {
    main: (p.main_image_urls || []).map((url) => ({ url, file: null, originalFile: null, previewUrl: null, isImage: true })),
    layout: (p.layout_urls || []).map((url) => ({ url, file: null, originalFile: null, previewUrl: null, isImage: isImageUrl(url) })),
  };
  const modal = document.getElementById('productModal');

function uploadFileWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${API_BASE}/upload`);
    xhr.setRequestHeader('Authorization', `Bearer ${token()}`);
    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && onProgress) onProgress(Math.round((ev.loaded / ev.total) * 100));
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(new Error('解析响应失败')); }
      } else if (xhr.status === 401) {
        setToken(null);
        showLogin('登录已过期，请重新登录');
        reject(new Error('unauthorized'));
      } else {
        let detail = xhr.statusText || ('HTTP ' + xhr.status);
        try { detail = JSON.parse(xhr.responseText).detail || detail; } catch (e) {}
        reject(new Error(detail));
      }
    };
    xhr.onerror = () => reject(new Error('网络错误'));
    const fd = new FormData();
    fd.append('file', file);
    xhr.send(fd);
  });
}

async function uploadAllAttachments(kind) {
  const urls = [];
  const list = attachmentsState[kind];
  for (let i = 0; i < list.length; i++) {
    const entry = list[i];
    if (entry.file) {
      const progressWrap = document.getElementById(`att-${kind}-progress-${i}`);
      const progressBar = document.getElementById(`att-${kind}-progressbar-${i}`);
      const progressText = document.getElementById(`att-${kind}-progresstext-${i}`);
      if (progressWrap) { progressWrap.hidden = false; progressBar.style.width = '0%'; progressText.textContent = '0%'; }
      try {
        const res = await uploadFileWithProgress(entry.file, (pct) => {
          if (progressBar) progressBar.style.width = pct + '%';
          if (progressText) progressText.textContent = pct + '%';
        });
        urls.push(res.url);
      } finally {
        if (progressWrap) progressWrap.hidden = true;
      }
    } else if (entry.url) {
      urls.push(entry.url);
    }
  }
  return urls;
}

const STALE_DAYS = 3; // 超过这么多天没更新，标"即将超时"；"已提醒"标记也在这个窗口内算有效
const LARGE_AMOUNT_THRESHOLD = 200000; // 成交金额达到这个数，标"大额订单"

const FLAG_META = {
  pending: { dot: 'dot-red', label: '待处理订单' },
  stale: { dot: 'dot-orange', label: '即将超时的订单' },
  large: { dot: 'dot-blue', label: '大额订单' },
  reminded: { dot: 'dot-green', label: '已提醒的' },
};

function orderFlags(o) {
  const flags = [];
  const isTerminal = o.stage === 'deal_closed' || o.stage === 'delivered';
  const daysSinceUpdate = (Date.now() - (Date.parse(o.updated_at) || Date.now())) / 86400000;
  if (o.stage === 'initial_chat') flags.push('pending');
  if (!isTerminal && daysSinceUpdate >= STALE_DAYS) flags.push('stale');
  if (o.amount >= LARGE_AMOUNT_THRESHOLD) flags.push('large');
  if (o.last_reminded_at && (Date.now() - (Date.parse(o.last_reminded_at) || 0)) / 86400000 < STALE_DAYS) flags.push('reminded');
  return flags;
}

let selectedOrderMonth = null; // { year, month(0-indexed) }，默认当月

function buildMonthOptions() {
  const now = new Date();
  const opts = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    opts.push({ year: d.getFullYear(), month: d.getMonth() });
  }
  return opts;
}

function ordersInMonth(orderList, year, month) {
  return orderList.filter((o) => {
    const d = new Date(o.created_at);
    return d.getFullYear() === year && d.getMonth() === month;
  });
}

function monthStats(orderList, year, month) {
  const count = ordersInMonth(orderList, year, month).length;
  const prev = new Date(year, month - 1, 1);
  const prevCount = ordersInMonth(orderList, prev.getFullYear(), prev.getMonth()).length;
  const pct = prevCount === 0 ? (count === 0 ? 0 : 100) : ((count - prevCount) / prevCount) * 100;
  return { count, pct };
}

function stageClass(key) {

// 不单独存数据，直接拿 /orders 按 assigned_to 分组统计；同样按跟单猿口令锁定。

function computeSalesPerformance(username) {
  const mine = orders.filter((o) => o.assigned_to === username);
  const now = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const newThisMonth = mine.filter((o) => String(o.created_at || '').slice(0, 7) === monthKey).length;
  const stageCounts = {};
  CUSTOMER_STAGES.forEach((s) => { stageCounts[s.key] = 0; });
  mine.forEach((o) => { if (stageCounts[o.stage] != null) stageCounts[o.stage]++; });
  const dealOrders = mine.filter((o) => o.stage === 'deal_closed' || o.stage === 'delivered');
  const deliveredCount = mine.filter((o) => o.stage === 'delivered').length;
  return {
    total: mine.length,
    newThisMonth,
    stageCounts,
    dealCount: dealOrders.length,
    dealAmount: dealOrders.reduce((sum, o) => sum + (o.amount || 0), 0),
    deliveredCount,
  };
}

function fullPerformanceRowHtml(username) {
  const p = computeSalesPerformance(username);
  const stagePillsHtml = CUSTOMER_STAGES.map((s, i) => `
    <span style="display:inline-flex;align-items:center;font-size:12px;font-weight:600;background:var(--card-2);color:var(--ink-soft);padding:3px 8px;border-radius:999px;margin:2px 4px 0 0;">${i + 1}.${escapeHtml(s.label)} ${p.stageCounts[s.key]}</span>
  `).join('');
  return `
    <div class="row-item" style="align-items:flex-start;">
      <div class="row-body">
        <div class="row-title">${escapeHtml(username)}</div>
        <div class="row-sub">总客户 ${p.total} · 本月新增 ${p.newThisMonth} · 成交 ${p.dealCount}（¥${fmtNum(p.dealAmount)}） · 交付 ${p.deliveredCount}</div>
        <div style="margin-top:6px;">${stagePillsHtml}</div>
      </div>
    </div>
  `;
}

  return `
    <div class="row-item">
      <div class="row-body"><div class="row-title">${escapeHtml(username)}</div></div>
      <div class="row-btns">

let creativeProjects = [];
