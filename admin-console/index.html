        <label>人物照片（数字人形象）</label>
        <div style="display:flex; gap:12px; align-items:center; margin-top:6px;">
          <div class="creative-person-thumb">${thumb}</div>
          <div>
            <input type="file" id="cpPersonInput" accept="image/*" hidden onchange="handleCreativePersonSelect(event)">
            <button class="ghost" type="button" onclick="document.getElementById('cpPersonInput').click()">选择照片</button>
          </div>
        </div>
      </div>
      <div><label>匹配商品</label><select id="cpProduct">${productOptionsHtml(null)}</select></div>
      <div><label>视频时长（秒，1-30）</label><input type="number" id="cpDuration" min="1" max="30" value="15"></div>
    </div>
    <div class="actions"><button onclick="submitNewCreativeProject()">创建项目</button></div>
    <p class="msg" id="creativeFormMsg"></p>
  `;
}

function handleCreativePersonSelect(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  creativePersonPhoto = { file, previewUrl: URL.createObjectURL(file) };
  renderCreateRightPanel();
}

async function submitNewCreativeProject() {
  const msg = document.getElementById('creativeFormMsg');
  const name = document.getElementById('cpName').value.trim();
  if (!name) { msg.textContent = '请填写项目名称'; msg.className = 'msg error'; return; }
  if (!creativePersonPhoto) { msg.textContent = '请先选择人物照片'; msg.className = 'msg error'; return; }
  msg.textContent = '创建中...';
  msg.className = 'msg';
  try {
    const uploaded = await uploadFileWithProgress(creativePersonPhoto.file);
    const payload = {
      name,
      person_photo_url: uploaded.url,
      product_id: document.getElementById('cpProduct').value || null,
      duration_seconds: Number(document.getElementById('cpDuration').value) || 15,
    };
    const project = await api('/creative', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    setCreativeProject(project);
    activeCreativeProjectId = project.id;
    creativePersonPhoto = null;
    renderCreativeProjectList();
    renderCreateRightPanel();
  } catch (e) {
    msg.textContent = '创建失败：' + e.message;
    msg.className = 'msg error';
  }
}

function renderCreativeWizard(project) {
  const personImg = project.person_photo_url ? `<img src="${staticUrl(project.person_photo_url)}" alt="">` : '未上传';
  const allDone = project.shots.length > 0 && project.shots.every((s) => s.status === 'done');
  return `
    <h2>${escapeHtml(project.name)}</h2>
    <div class="form-grid">
      <div class="full">
        <label>人物照片</label>
        <div style="display:flex; gap:12px; align-items:center; margin-top:6px;">
          <div class="creative-person-thumb">${personImg}</div>
          <div>
            <input type="file" id="cwPersonInput" accept="image/*" hidden onchange="handleWizardPersonReplace(event)">
            <button class="ghost" type="button" onclick="document.getElementById('cwPersonInput').click()">更换照片</button>
          </div>
        </div>
      </div>
      <div><label>匹配商品</label><select id="cwProduct" onchange="updateCreativeBasic()">${productOptionsHtml(project.product_id)}</select></div>
      <div><label>视频时长（秒，1-30）</label><input type="number" id="cwDuration" min="1" max="30" value="${project.duration_seconds}" onchange="updateCreativeBasic()"></div>
    </div>
    <p class="msg" id="creativeBasicMsg"></p>

    <div class="actions">
      <button onclick="generateCreativeScript()">${project.script_text ? '重新生成脚本' : '生成脚本'}</button>
    </div>

    ${project.shots.length ? `
      <div style="margin-top:16px;">
        <label>完整文案</label>
        <textarea id="creativeScriptText" rows="4" style="width:100%; margin-top:6px;">${escapeHtml(project.script_text)}</textarea>
      </div>
      <div id="creativeShotsList">${project.shots.map((s) => renderShotCard(s)).join('')}</div>
      <div class="actions">
        <button class="ghost" onclick="saveCreativeScript()">保存脚本修改</button>
        <button onclick="composeCreativeVideo()" ${allDone ? '' : 'disabled'}>合成长视频</button>
      </div>
      <p class="msg" id="creativeScriptMsg"></p>
    ` : '<div class="empty-hint" style="margin-top:12px;">还没有脚本，点上面「生成脚本」</div>'}

    ${project.final_video_url ? `
      <div style="margin-top:16px;"><label>最终合成视频</label><br><video controls src="${staticUrl(project.final_video_url)}" style="max-width:320px; border-radius:8px; margin-top:6px;"></video></div>
    ` : ''}
  `;
}

function renderShotCard(shot) {
  const statusText = creativeStatusLabel(shot.status);
  const isRedo = shot.status === 'done' || shot.status === 'failed';
  return `
    <div class="shot-card" id="shotCard-${shot.index}">
      <div class="shot-card-head">
        <span class="shot-time-label">分镜 ${shot.index + 1} · ${shot.start_sec}-${shot.end_sec}秒</span>
        <span class="shot-status-badge shot-status-${shot.status}">${statusText}</span>
      </div>
      <label>台词</label>
      <textarea id="shotNarration-${shot.index}" rows="2">${escapeHtml(shot.narration)}</textarea>
      <label>画面描述</label>
      <textarea id="shotVisual-${shot.index}" rows="2">${escapeHtml(shot.visual_desc)}</textarea>
      ${shot.error_message ? `<div class="shot-error-text">${escapeHtml(shot.error_message)}</div>` : ''}
      ${shot.video_url ? `<video controls src="${shot.video_url}"></video>` : ''}
      <div class="actions">
        <button ${shot.status === 'generating' ? 'disabled' : ''} onclick="${isRedo ? 'regenerateShot' : 'generateShot'}(${shot.index})">${isRedo ? '重新生成' : '生成本镜头'}</button>
      </div>
    </div>
  `;
}

async function updateCreativeBasic() {
  const project = getActiveCreativeProject();
  if (!project) return;
  const msg = document.getElementById('creativeBasicMsg');
  const payload = {
    name: project.name,
    person_photo_url: project.person_photo_url,
    product_id: document.getElementById('cwProduct').value || null,
    duration_seconds: Number(document.getElementById('cwDuration').value) || project.duration_seconds,
  };
  msg.textContent = '保存中...';
  msg.className = 'msg';
  try {
    const updated = await api(`/creative/${project.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    setCreativeProject(updated);
    msg.textContent = '已保存';
    msg.className = 'msg ok';
    renderCreativeProjectList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

async function handleWizardPersonReplace(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const project = getActiveCreativeProject();
  if (!project) return;
  const msg = document.getElementById('creativeBasicMsg');
  msg.textContent = '上传中...';
  msg.className = 'msg';
  try {
    const uploaded = await uploadFileWithProgress(file);
    const updated = await api(`/creative/${project.id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: project.name, person_photo_url: uploaded.url, product_id: project.product_id, duration_seconds: project.duration_seconds }),
    });
    setCreativeProject(updated);
    renderCreateRightPanel();
  } catch (e) {
    msg.textContent = '上传失败：' + e.message;
    msg.className = 'msg error';
  }
}

async function generateCreativeScript() {
  const project = getActiveCreativeProject();
  if (!project) return;
  try {
    const updated = await api(`/creative/${project.id}/generate-script`, { method: 'POST' });
    setCreativeProject(updated);
    stopAllShotPolling();
    renderCreativeProjectList();
    renderCreateRightPanel();
  } catch (e) {
    alert('生成脚本失败：' + e.message);
  }
}

function collectShotsFromForm(project) {
  return project.shots.map((s) => ({
    ...s,
    narration: document.getElementById(`shotNarration-${s.index}`).value,
    visual_desc: document.getElementById(`shotVisual-${s.index}`).value,
  }));
}

function persistScriptEdits(project) {
  const scriptTextEl = document.getElementById('creativeScriptText');
  const payload = {
    script_text: scriptTextEl ? scriptTextEl.value : project.script_text,
    shots: collectShotsFromForm(project),
  };
  return api(`/creative/${project.id}/script`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
}

async function saveCreativeScript() {
  const project = getActiveCreativeProject();
  if (!project) return;
  const msg = document.getElementById('creativeScriptMsg');
  msg.textContent = '保存中...';
  msg.className = 'msg';
  try {
    const updated = await persistScriptEdits(project);
    setCreativeProject(updated);
    msg.textContent = '已保存';
    msg.className = 'msg ok';
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

function applyShotUpdate(projectId, shot) {
  const project = creativeProjects.find((p) => p.id === projectId);
  if (!project) return;
  const idx = project.shots.findIndex((s) => s.index === shot.index);
  if (idx !== -1) project.shots[idx] = shot; else project.shots.push(shot);
  const card = document.getElementById(`shotCard-${shot.index}`);
  if (card) card.outerHTML = renderShotCard(shot);
  const composeBtn = document.querySelector('#creativeRightPanel .actions button[onclick="composeCreativeVideo()"]');
  if (composeBtn) composeBtn.disabled = !(project.shots.length && project.shots.every((s) => s.status === 'done'));
}

async function triggerShot(index, action) {
  const project = getActiveCreativeProject();
  if (!project) return;
  try {
    const saved = await persistScriptEdits(project);
    setCreativeProject(saved);
    const shot = await api(`/creative/${project.id}/shots/${index}/${action}`, { method: 'POST' });
    applyShotUpdate(project.id, shot);
    if (shot.status === 'generating') startShotPolling(project.id, index);
  } catch (e) {
    alert('操作失败：' + e.message);
  }
}

function generateShot(index) { triggerShot(index, 'generate'); }
function regenerateShot(index) { triggerShot(index, 'regenerate'); }

function startShotPolling(projectId, index) {
  if (shotPollTimers[index]) clearInterval(shotPollTimers[index]);
  shotPollTimers[index] = setInterval(async () => {
    try {
      const shot = await api(`/creative/${projectId}/shots/${index}/status`);
      applyShotUpdate(projectId, shot);
      if (shot.status !== 'generating') {
        clearInterval(shotPollTimers[index]);
        delete shotPollTimers[index];
      }
    } catch (e) {
      clearInterval(shotPollTimers[index]);
      delete shotPollTimers[index];
    }
  }, 5000);
}

async function composeCreativeVideo() {
  const project = getActiveCreativeProject();
  if (!project) return;
  try {
    const updated = await api(`/creative/${project.id}/compose`, { method: 'POST' });
    setCreativeProject(updated);
    renderCreativeProjectList();
    renderCreateRightPanel();
  } catch (e) {
    alert('合成失败：' + e.message);
  }
}

/* ---------------- Brand name ---------------- */

let brandName = '房车';
let suppressBlurSave = false;

async function loadSettings() {
  try {
    const res = await fetch(`${PUBLIC_API_BASE}/settings`);
    if (res.ok) { brandName = (await res.json()).brand_name || '房车'; }
  } catch (e) {}
  renderBrand();
}

function renderBrand() {
  document.getElementById('brandPart').textContent = brandName;
  document.querySelectorAll('.brand-part-login').forEach((el) => { el.textContent = brandName; });
  document.title = `${brandName}账号矩阵中枢 · 管理台`;
}

function startEditBrand() {
  document.getElementById('brandPart').hidden = true;
  const input = document.getElementById('brandInput');
  input.value = brandName;
  input.hidden = false;
  input.focus();
  input.select();
}

function showBrandDisplay() {
  document.getElementById('brandPart').hidden = false;
  document.getElementById('brandInput').hidden = true;
}

function cancelEditBrand() {
  suppressBlurSave = true;
  showBrandDisplay();
  setTimeout(() => { suppressBlurSave = false; }, 0);
}

async function saveBrand() {
  if (suppressBlurSave) return;
  const val = document.getElementById('brandInput').value.trim();
  if (!val || val === brandName) { showBrandDisplay(); return; }
  try {
    await api('/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ brand_name: val }) });
    brandName = val;
    renderBrand();
  } catch (e) {
    alert('保存失败：' + e.message);
  } finally {
    showBrandDisplay();
  }
}

/* ---------------- Boot ---------------- */

async function boot() {
  await loadSettings();
  if (!token()) { showLogin(); return; }
  try {
    currentUser = await api('/auth/me');
    await enterApp();
  } catch (e) {
    showLogin();
  }
}

boot();
</script>
