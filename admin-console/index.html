<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩阵中枢 · 管理台</title>
<style>
  :root {
    --bg: #0f1218;
    --sidebar: #12151f;
    --card: #1a1e2b;
    --card-2: #232838;
    --line: #2a3040;
    --ink: #e8eaf0;
    --ink-soft: #8890a3;
    --ink-faint: #5b6377;
    --accent: #4f7dfa;
    --accent-soft: rgba(79, 125, 250, 0.16);
    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.14);
    --danger: #f472b6;
    --danger-soft: rgba(244, 114, 182, 0.14);
    --warning: #eab308;
    --warning-soft: rgba(234, 179, 8, 0.12);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  [hidden] { display: none !important; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  input[type="text"], input[type="password"], input[type="number"], select {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink);
    font-size: 14px;
  }
  label { font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--success); }

  /* ---------- Login ---------- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 32px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p.hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
  }
  .brand-block { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.3; }
  .brand-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .brand-sub { font-size: 10px; letter-spacing: 0.06em; color: var(--ink-faint); text-transform: uppercase; }
  .brand-box {
    border: 1px dashed transparent;
    border-radius: 5px;
    padding: 0 4px;
    cursor: pointer;
  }
  .brand-box.editable { border-color: var(--line); }
  .brand-box.editable:hover { border-color: var(--accent); background: var(--accent-soft); }
  #brandInput { width: 96px; padding: 1px 6px; font-size: 15px; font-weight: 700; border-radius: 5px; }

  .nav-group-label { font-size: 11px; color: var(--ink-faint); padding: 14px 12px 6px; letter-spacing: 0.04em; }
  .nav-item {
    padding: 10px 12px; border-radius: 10px; font-size: 14px;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.04); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .tag {
    font-size: 10px; color: var(--ink-faint); background: rgba(255, 255, 255, 0.06);
    padding: 1px 6px; border-radius: 999px; margin-left: auto;
  }

  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-soft); }
  .role-badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; }
  .content-body { padding: 24px 28px 80px; max-width: 1200px; }

  /* ---------- Account switcher ---------- */
  .acc-switcher { position: relative; }
  .acc-switcher-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px;
    font-weight: 600; font-size: 14px;
  }
  .acc-avatar {
    width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
  }
  .chevron { color: var(--ink-faint); font-size: 11px; }
  .acc-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 220px; max-height: 320px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); z-index: 20;
  }
  .acc-dropdown-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; cursor: pointer;
  }
  .acc-dropdown-item:hover { background: rgba(255, 255, 255, 0.05); }
  .acc-dropdown-item .acc-sub { font-size: 11px; color: var(--ink-faint); margin-left: auto; }

  /* ---------- Overview page ---------- */
  .page-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .page-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }

  .alert-banner {
    display: flex; align-items: center; gap: 10px; background: var(--warning-soft); border: 1px solid rgba(234,179,8,0.3);
    color: var(--warning); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px;
  }
  .alert-banner .close-btn { margin-left: auto; background: transparent; color: var(--warning); padding: 0 4px; font-size: 15px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 20px; }
  .kpi-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .kpi-label { font-size: 12px; color: var(--ink-soft); }
  .kpi-value { font-size: 24px; font-weight: 700; }
  .kpi-delta { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; width: fit-content; }
  .kpi-delta.up { background: var(--success-soft); color: var(--success); }
  .kpi-delta.down { background: var(--danger-soft); color: var(--danger); }
  .kpi-spark { width: 100%; height: 36px; }
  .kpi-combined { display: flex; gap: 10px; }
  .kpi-combined-item { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi-combined-val { font-size: 18px; font-weight: 700; }
  .kpi-combined-label { font-size: 11px; color: var(--ink-soft); }
  .kpi-combined .kpi-delta { font-size: 10px; padding: 1px 6px; }

  .overview-lower { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: stretch; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  .panel-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .period-toggle { display: flex; gap: 4px; background: var(--card-2); border-radius: 8px; padding: 3px; }
  .period-toggle button {
    background: transparent; color: var(--ink-soft); padding: 5px 14px; font-size: 12px; border-radius: 6px;
  }
  .period-toggle button.active { background: var(--accent); color: #fff; }
  .trend-chart { width: 100%; height: 220px; }

  .diagnosis-meta { font-size: 11px; color: var(--ink-faint); margin-bottom: 14px; }
  .diagnosis-block { display: flex; gap: 10px; margin-bottom: 16px; }
  .diagnosis-tag {
    flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 6px; height: fit-content;
  }
  .diagnosis-tag.risk { background: var(--danger-soft); color: var(--danger); }
  .diagnosis-tag.opportunity { background: var(--success-soft); color: var(--success); }
  .diagnosis-text { font-size: 13px; line-height: 1.7; color: var(--ink); }
  .diagnosis-back {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent);
    cursor: pointer; margin-bottom: 14px; background: none; padding: 0; font-weight: 600;
  }
  .video-stats-row { display: flex; gap: 16px; margin: 10px 0 16px; }
  .video-stats-row span { font-size: 12px; color: var(--ink-soft); }

  .video-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .video-thumb-item { flex-shrink: 0; width: 140px; cursor: pointer; }
  .video-thumb-item img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 10px;
    border: 2px solid transparent; display: block;
  }
  .video-thumb-item.active img { border-color: var(--accent); }
  .video-thumb-item .thumb-title {
    display: block; font-size: 11px; color: var(--ink-soft); margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .video-thumb-item.active .thumb-title { color: var(--accent); }

  /* ---------- Generic list / form panels (banners, users, accounts) ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .actions { margin-top: 16px; display: flex; gap: 10px; }
  .row-item { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row-item:last-child { border-bottom: none; }
  .row-item img { width: 120px; height: 48px; object-fit: cover; border-radius: 8px; background: var(--card-2); flex-shrink: 0; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; font-size: 14px; }
  .row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns button { padding: 6px 12px; font-size: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; flex-shrink: 0;
  }
  .badge-dark { background: #05070c; color: #fff; }
  .badge-green { background: var(--success-soft); color: var(--success); }
  .badge-pink { background: var(--danger-soft); color: var(--danger); }
  .badge-blue { background: var(--accent-soft); color: var(--accent); }

  .empty-hint { color: var(--ink-soft); font-size: 13px; text-align: center; padding: 40px 0; }

  @media (max-width: 1024px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    .overview-lower { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <div class="login-card">
    <h1><span class="brand-part-login">房车</span>矩阵中枢</h1>
    <p class="hint">管理台登录</p>
    <div>
      <label>用户名</label>
      <input type="text" id="loginUsername">
    </div>
    <div>
      <label>密码</label>
      <input type="password" id="loginPassword">
    </div>
    <button onclick="login()">登录</button>
    <p class="msg" id="loginMsg"></p>
  </div>
</div>

<div id="appShell" hidden>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">中</div>
        <div class="brand-text">
          <span class="brand-title">
            <span id="brandPart" class="brand-box editable" ondblclick="startEditBrand()" title="双击编辑">房车</span><input
              type="text" id="brandInput" hidden
              onblur="saveBrand()"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}else if(event.key==='Escape'){cancelEditBrand();}">矩阵中枢
          </span>
          <span class="brand-sub">MATRIX OPS CONSOLE</span>
        </div>
      </div>

      <div class="nav-group-label">工作台</div>
      <div id="navGroupWork"></div>
      <div class="nav-group-label">系统管理</div>
      <div id="navGroupSystem"></div>
    </nav>

    <main class="main-area">
      <header class="content-header">
        <div class="header-left" id="headerLeft"></div>
        <div class="header-right">
          <span class="role-badge" id="roleBadge"></span>
          <span id="usernameLabel"></span>
          <button class="ghost" onclick="logout()">退出登录</button>
        </div>
      </header>
      <div class="content-body">
        <section id="section-overview"></section>
        <section id="section-accounts" hidden></section>
        <section id="section-banners" hidden></section>
        <section id="section-users" hidden></section>
        <section id="section-stub" hidden></section>
      </div>
    </main>
  </div>
</div>

<script>
const API_BASE = '/admin/api/admin';
const PUBLIC_API_BASE = '/admin/api';
let currentUser = null;
let allAccounts = [];
let currentAccountId = 'all';
let overviewCache = {};
let activeSection = 'overview';
let trendPeriod = 7;

const NAV_WORK = [
  { key: 'overview', label: '经营分析总览' },
  { key: 'accounts', label: '矩阵账号' },
  { key: 'create', label: '内容创作台', stub: true },
  { key: 'benchmark', label: '爆款视频库', stub: true },
  { key: 'service', label: 'AI 客服', stub: true },
  { key: 'orders', label: '订单跟踪', stub: true },
];
const NAV_SYSTEM = [
  { key: 'banners', label: '轮播图管理' },
  { key: 'users', label: '账号管理', roles: ['super_admin'] },
];

function token() { return localStorage.getItem('rv_admin_token') || ''; }
function setToken(t) { t ? localStorage.setItem('rv_admin_token', t) : localStorage.removeItem('rv_admin_token'); }

async function api(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${token()}` },
  });
  if (res.status === 401) {
    setToken(null);
    showLogin('登录已过期，请重新登录');
    throw new Error('unauthorized');
  }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : null;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtNum(n) {
  if (n === undefined || n === null) return '0';
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + '万';
  return Math.round(n).toLocaleString('zh-CN');
}
function platformInitial(p) { return { douyin: '抖', video_channel: '视', xiaohongshu: '红' }[p] || '·'; }
function platformBadge(p) { return { douyin: 'badge-dark', video_channel: 'badge-green', xiaohongshu: 'badge-pink' }[p] || 'badge-blue'; }

function showLogin(msg) {
  document.getElementById('loginView').hidden = false;
  document.getElementById('appShell').hidden = true;
  if (msg) {
    document.getElementById('loginMsg').textContent = msg;
    document.getElementById('loginMsg').className = 'msg error';
  }
}

async function login() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; msg.className = 'msg error'; return; }
  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || '登录失败'); }
    const data = await res.json();
    setToken(data.token);
    currentUser = data.user;
    await enterApp();
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

function logout() {
  api('/auth/logout', { method: 'POST' }).catch(() => {});
  setToken(null);
  currentUser = null;
  location.reload();
}

async function enterApp() {
  document.getElementById('loginView').hidden = true;
  document.getElementById('appShell').hidden = false;
  document.getElementById('roleBadge').textContent = currentUser.role === 'super_admin' ? '超级管理员' : '运营';
  document.getElementById('usernameLabel').textContent = currentUser.username;
  renderNav();
  try { allAccounts = await fetch(`${PUBLIC_API_BASE}/accounts`).then((r) => r.json()); } catch (e) { allAccounts = []; }
  await showSection('overview');
}

function renderNav() {
  const work = document.getElementById('navGroupWork');
  const sys = document.getElementById('navGroupSystem');
  const render = (items) => items
    .filter((item) => !item.roles || item.roles.includes(currentUser.role))
    .map((item) => `
      <div class="nav-item ${item.key === activeSection ? 'active' : ''}" onclick="showSection('${item.key}')">
        ${item.label}${item.stub ? '<span class="tag">建设中</span>' : ''}
      </div>
    `).join('');
  work.innerHTML = render(NAV_WORK);
  sys.innerHTML = render(NAV_SYSTEM);
}

async function showSection(key) {
  activeSection = key;
  renderNav();
  document.getElementById('headerLeft').innerHTML = '';
  ['overview', 'accounts', 'banners', 'users', 'stub'].forEach((k) => {
    document.getElementById(`section-${k}`).hidden = true;
  });

  if (key === 'overview') {
    document.getElementById('section-overview').hidden = false;
    renderAccountSwitcher();
    await renderOverview();
  } else if (key === 'accounts') {
    document.getElementById('section-accounts').hidden = false;
    renderAccountsPage();
  } else if (key === 'banners') {
    document.getElementById('section-banners').hidden = false;
    await loadBanners();
    renderBanners();
  } else if (key === 'users') {
    document.getElementById('section-users').hidden = false;
    await loadUsers();
    renderUsers();
  } else {
    document.getElementById('section-stub').hidden = false;
    const item = [...NAV_WORK, ...NAV_SYSTEM].find((i) => i.key === key);
    document.getElementById('section-stub').innerHTML = `<div class="panel"><div class="empty-hint">「${item.label}」模块还在开发计划里，暂未上线。</div></div>`;
  }
}

/* ---------------- Account switcher ---------------- */

function renderAccountSwitcher() {
  const current = allAccounts.find((a) => a.id === currentAccountId);
  const label = currentAccountId === 'all' ? '全部账号' : (current ? current.nickname : currentAccountId);
  const avatarText = currentAccountId === 'all' ? '全' : platformInitial(current ? current.platform : '');
  document.getElementById('headerLeft').innerHTML = `
    <div class="acc-switcher" id="accSwitcher">
      <button class="acc-switcher-btn" onclick="toggleAccDropdown(event)">
        <span class="acc-avatar">${avatarText}</span>
        <span>${escapeHtml(label)}</span>
        <span class="chevron">▾</span>
      </button>
      <div class="acc-dropdown" id="accDropdown" hidden>
        <div class="acc-dropdown-item" onclick="selectAccount('all')">
          <span class="acc-avatar">全</span> 全部账号
        </div>
        ${allAccounts.map((a) => `
          <div class="acc-dropdown-item" onclick="selectAccount('${a.id}')">
            <span class="acc-avatar">${platformInitial(a.platform)}</span> ${escapeHtml(a.nickname)}
            <span class="acc-sub">${fmtNum(a.follower_count)} 粉丝</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleAccDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('accDropdown');
  dd.hidden = !dd.hidden;
}
document.addEventListener('click', () => {
  const dd = document.getElementById('accDropdown');
  if (dd) dd.hidden = true;
});

async function selectAccount(id) {
  currentAccountId = id;
  renderAccountSwitcher();
  await renderOverview();
}

/* ---------------- Overview (经营分析总览) ---------------- */

async function fetchOverview(accountId, period) {
  const key = `${accountId}:${period}`;
  if (overviewCache[key]) return overviewCache[key];
  const res = await fetch(
    `${PUBLIC_API_BASE}/dashboard/overview?account_id=${encodeURIComponent(accountId)}&period=${period}`,
    { headers: { Authorization: `Bearer ${token()}` } },
  );
  if (res.status === 401) { setToken(null); showLogin('登录已过期，请重新登录'); throw new Error('unauthorized'); }
  if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || res.statusText); }
  const data = await res.json();
  overviewCache[key] = data;
  return data;
}

function sparklinePath(series, w, h) {
  if (!series || series.length < 2) return '';
  const min = Math.min(...series);
  const max = Math.max(...series);
  const range = max - min || 1;
  const stepX = w / (series.length - 1);
  return series.map((v, i) => `${i === 0 ? 'M' : 'L'}${(i * stepX).toFixed(1)},${(h - ((v - min) / range) * h).toFixed(1)}`).join(' ');
}

function deltaBadge(m) {
  const up = m.change_pct >= 0;
  return `<span class="kpi-delta ${up ? 'up' : 'down'}">${up ? '↗' : '↘'} ${Math.abs(m.change_pct)}%</span>`;
}

function renderKpiGrid(todayMetrics) {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = KPI_DEFS.map((def) => {
    if (def.combined) {
      return `
        <div class="kpi-card">
          <span class="kpi-label">${def.label}（今日）</span>
          <div class="kpi-combined">
            ${def.parts.map((p) => {
              const m = todayMetrics[p.key];
              return `
                <div class="kpi-combined-item">
                  <span class="kpi-combined-val">${fmtNum(m.value)}</span>
                  <span class="kpi-combined-label">${p.label}</span>
                  ${deltaBadge(m)}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }
    const m = todayMetrics[def.key];
    const up = m.change_pct >= 0;
    const color = up ? '#34d399' : '#f472b6';
    const path = sparklinePath(m.series, 200, 36);
    return `
      <div class="kpi-card">
        <span class="kpi-label">${def.label}（今日）</span>
        <span class="kpi-value">${def.fmt(m.value)}</span>
        ${deltaBadge(m)}
        <svg class="kpi-spark" viewBox="0 0 200 36" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
        </svg>
      </div>
    `;
  }).join('');
}

async function setTrendPeriod(period) {
  trendPeriod = period;
  document.getElementById('pt7').classList.toggle('active', period === 7);
  document.getElementById('pt30').classList.toggle('active', period === 30);
  const data = await fetchOverview(currentAccountId, period);
  renderTrendChart(data.trend);
}

function renderTrendChart(trend) {
  const svg = document.getElementById('trendChart');
  if (!svg) return;
  const W = 640, H = 220, padL = 56, padR = 16, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const all = [...trend.plays, ...trend.new_followers];
  const max = Math.max(...all, 1);
  const min = 0;
  const n = trend.dates.length;
  const stepX = n > 1 ? plotW / (n - 1) : 0;
  const scaleY = (v) => padT + plotH - ((v - min) / (max - min || 1)) * plotH;
  const scaleX = (i) => padL + i * stepX;

  const line = (series) => series.map((v, i) => `${i === 0 ? 'M' : 'L'}${scaleX(i).toFixed(1)},${scaleY(v).toFixed(1)}`).join(' ');

  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + plotH * (1 - f);
    const val = Math.round(max * f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2a3040" stroke-width="1"/>
            <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#5b6377">${fmtNum(val)}</text>`;
  }).join('');

  const xLabels = trend.dates.map((d, i) => {
    if (n > 10 && i % Math.ceil(n / 6) !== 0) return '';
    return `<text x="${scaleX(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5b6377">${d}</text>`;
  }).join('');

  const lastPlays = trend.plays[trend.plays.length - 1];
  const lastFollowers = trend.new_followers[trend.new_followers.length - 1];

  svg.innerHTML = `
    ${gridLines}
    ${xLabels}
    <path d="${line(trend.plays)}" fill="none" stroke="#4f7dfa" stroke-width="2.5"/>
    <path d="${line(trend.new_followers)}" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="${scaleX(n - 1)}" cy="${scaleY(lastPlays)}" r="4" fill="#4f7dfa"/>
    <circle cx="${scaleX(n - 1)}" cy="${scaleY(lastFollowers)}" r="4" fill="#f59e0b"/>
    <text x="${scaleX(n - 1) - 8}" y="${scaleY(lastPlays) - 10}" text-anchor="end" font-size="11" fill="#4f7dfa" font-weight="700">${fmtNum(lastPlays)}</text>
    <text x="${scaleX(n - 1) - 8}" y="${scaleY(lastFollowers) - 10}" text-anchor="end" font-size="11" fill="#f59e0b" font-weight="700">${fmtNum(lastFollowers)}</text>
  `;
}

let banners = [];
let editingBannerId = null;

async function loadBanners() { banners = await api('/banners'); }

function renderBanners() {
  const el = document.getElementById('section-banners');
  el.innerHTML = `
    <div class="page-title">轮播图管理</div>
    <div class="panel" style="margin-bottom:16px;">
      <h2 id="bannerFormTitle">新增轮播图</h2>

        <div class="full"><label>副标题</label><input type="text" id="fSubtitle"></div>
        <div><label>排序（数字越小越靠前）</label><input type="number" id="fSort" value="0"></div>
        <div><label>跳转链接（可选）</label><input type="text" id="fLink"></div>

          <label>图片</label>

          <input type="hidden" id="fImageUrl">
        </div>
      </div>
      <div class="actions">
        <button onclick="submitBanner()">保存</button>
        <button class="ghost" onclick="resetBannerForm()">清空</button>
      </div>
      <p class="msg" id="bannerFormMsg"></p>
    </div>
    <div class="panel">
      <h2>当前轮播图（按排序号显示）</h2>
      <div id="bannerList"></div>
    </div>
  `;
  renderBannerList();
}

function renderBannerList() {
  const list = document.getElementById('bannerList');
  if (!banners.length) { list.innerHTML = '<div class="empty-hint">暂无轮播图</div>'; return; }
  list.innerHTML = banners.slice().sort((a, b) => a.sort_order - b.sort_order).map((b) => `
    <div class="row-item">
      <img src="${b.image_url}" alt="">
      <div class="row-body">
        <div class="row-title">${escapeHtml(b.title)}</div>
        <div class="row-sub">${escapeHtml(b.subtitle || '')} · 排序 ${b.sort_order}</div>
      </div>
      <div class="row-btns">
        <button class="ghost" onclick="editBanner('${b.id}')">编辑</button>
        <button class="danger" onclick="deleteBanner('${b.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

function editBanner(id) {
  const b = banners.find((x) => x.id === id);
  if (!b) return;
  editingBannerId = id;
  document.getElementById('bannerFormTitle').textContent = '编辑轮播图';
  document.getElementById('fTitle').value = b.title;
  document.getElementById('fSubtitle').value = b.subtitle || '';
  document.getElementById('fSort').value = b.sort_order;
  document.getElementById('fLink').value = b.link_url || '';
  document.getElementById('fImageUrl').value = b.image_url;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetBannerForm() {
  editingBannerId = null;
  document.getElementById('bannerFormTitle').textContent = '新增轮播图';
  ['fTitle', 'fSubtitle', 'fLink', 'fImageUrl'].forEach((id) => { document.getElementById(id).value = ''; });
  document.getElementById('fSort').value = '0';
  document.getElementById('fImage').value = '';
  document.getElementById('bannerFormMsg').textContent = '';
}

async function deleteBanner(id) {
  if (!confirm('确定删除这条轮播图吗？')) return;
  await api(`/banners/${id}`, { method: 'DELETE' });
  await loadBanners();
  renderBannerList();
}

async function submitBanner() {
  const msg = document.getElementById('bannerFormMsg');
  msg.className = 'msg';
  msg.textContent = '保存中...';
  try {
    let imageUrl = document.getElementById('fImageUrl').value;
    const file = document.getElementById('fImage').files[0];
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      const uploadRes = await api('/upload', { method: 'POST', body: fd });
      imageUrl = uploadRes.url;
    }
    if (!imageUrl) { msg.textContent = '请上传图片'; msg.className = 'msg error'; return; }
    const payload = {
      title: document.getElementById('fTitle').value.trim(),
      subtitle: document.getElementById('fSubtitle').value.trim(),
      image_url: imageUrl,
      link_url: document.getElementById('fLink').value.trim() || null,
      sort_order: Number(document.getElementById('fSort').value) || 0,
    };
    if (!payload.title) { msg.textContent = '请填写标题'; msg.className = 'msg error'; return; }
    if (editingBannerId) {
      await api(`/banners/${editingBannerId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } else {
      await api('/banners', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }
    msg.textContent = '已保存';
    msg.className = 'msg ok';
    resetBannerForm();
    await loadBanners();
    renderBannerList();
  } catch (e) {
    msg.textContent = '保存失败：' + e.message;
    msg.className = 'msg error';
  }
}

async function submitUser() {

    msg.className = 'msg error';

async function deleteUser(id) {

/* ---------------- Brand name ---------------- */

let brandName = '房车';
let suppressBlurSave = false;

async function loadSettings() {
  try {
    const res = await fetch(`${PUBLIC_API_BASE}/settings`);
    if (res.ok) { brandName = (await res.json()).brand_name || '房车'; }
  } catch (e) {}
  renderBrand();
}

function renderBrand() {
  document.getElementById('brandPart').textContent = brandName;
  document.querySelectorAll('.brand-part-login').forEach((el) => { el.textContent = brandName; });
  document.title = `${brandName}矩阵中枢 · 管理台`;
}

function startEditBrand() {
  document.getElementById('brandPart').hidden = true;
  const input = document.getElementById('brandInput');
  input.value = brandName;
  input.hidden = false;
  input.focus();
  input.select();
}

function showBrandDisplay() {
  document.getElementById('brandPart').hidden = false;
  document.getElementById('brandInput').hidden = true;
}

function cancelEditBrand() {
  suppressBlurSave = true;
  showBrandDisplay();
  setTimeout(() => { suppressBlurSave = false; }, 0);
}

async function saveBrand() {
  if (suppressBlurSave) return;
  const val = document.getElementById('brandInput').value.trim();
  if (!val || val === brandName) { showBrandDisplay(); return; }
  try {
    await api('/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ brand_name: val }) });
    brandName = val;
    renderBrand();
  } catch (e) {
    alert('保存失败：' + e.message);
  } finally {
    showBrandDisplay();
  }
}

/* ---------------- Boot ---------------- */

async function boot() {
  await loadSettings();
  if (!token()) { showLogin(); return; }
  try {
    currentUser = await api('/auth/me');
    await enterApp();
  } catch (e) {
    showLogin();
  }
}

boot();
